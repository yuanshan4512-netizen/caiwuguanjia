<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#f0f0f5}
.shell{max-width:390px;margin:0 auto;height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#f0f0f5}

.d-stat{background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}

.d-stat-l{font-size:10px;color:#aaa;margin-top:3px}

.prog-lbl{display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-bottom:6px}

.bdv{font-size:12px;font-weight:600;color:#1a1a1a}

function pad2(n){return String(n).padStart(2,'0')}
function nowStr(){const d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes())}
function dateStr(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function todayStr(){return dateStr(new Date())}
function addDaysStr(n){const d=new Date();d.setDate(d.getDate()+n);return dateStr(d)}
function fmtN(n){const d=ST?.decimals==='2'?2:0;return '¥'+Number(Math.abs(n)).toFixed(d)}
function fmtRaw(n){const d=ST?.decimals==='2'?2:0;return Number(Math.abs(n)).toFixed(d)}
function autoType(t){return INCOME_KW.some(k=>t.includes(k))?'income':'expense'}
function autoCat(t,type){const cats=type==='income'?ICATS:type==='reimbursement'?RCATS:ECATS;for(const c of cats){const kws=CKWS[c.k]||[];if(kws.some(k=>t.includes(k)))return c.k;}return cats[0].k}
function getCatMeta(k,type){const cats=type==='income'?ICATS:type==='reimbursement'?RCATS:ECATS;return cats.find(c=>c.k===k)||cats[0]}
function daysLeft(dl){if(!dl)return null;return Math.ceil((new Date(dl)-new Date())/(86400000))}
function uniqueTs(base){let ts=base;while(RC.some(r=>r.ts===ts)||RM.some(r=>r.ts===ts))ts++;return ts}
function makeTs(date,time,offset=0){const clean=/^\d{1,2}:\d{1,2}$/.test(time||'')?time:nowStr();const n=new Date(date+'T'+clean+':00').getTime();return uniqueTs((Number.isFinite(n)?n:Date.now())+offset)}

function dateHint(t){
  if(/大前天/.test(t))return addDaysStr(-3);
  if(/前天/.test(t))return addDaysStr(-2);
  if(/昨天|昨日/.test(t))return addDaysStr(-1);
  if(/今天|今日/.test(t))return todayStr();
  const full=t.match(/(20\d{2})[年\-\/.](\d{1,2})[月\-\/.](\d{1,2})/);
  if(full)return `${full[1]}-${pad2(full[2])}-${pad2(full[3])}`;
  const md=t.match(/(\d{1,2})月(\d{1,2})[日号]?/)||t.match(/(?:^|\s)(\d{1,2})[\/.](\d{1,2})(?=\s|$)/);
  if(md){const d=new Date();return `${d.getFullYear()}-${pad2(md[1])}-${pad2(md[2])}`;}
  return null;
}
function leadingDateHint(t){
  const s=t.trim();
  if(/^(大前天|前天|昨天|昨日|今天|今日)/.test(s))return dateHint(s);
  if(/^(20\d{2})[年\-\/.]\d{1,2}[月\-\/.]\d{1,2}/.test(s))return dateHint(s);
  if(/^\d{1,2}[月\/.]\d{1,2}/.test(s))return dateHint(s);
  return null;
}
function timeHint(t){
  const m=t.match(/([01]?\d|2[0-3])[:：点](\d{1,2})?/);
  if(!m)return null;
  return pad2(m[1])+':'+pad2(m[2]||0);
}
function splitQuickEntries(raw){
  const normalized=raw.replace(/[，,；;、|/·\n]+/g,';').replace(/\s+/g,' ').trim();
  const parts=normalized.split(';').map(s=>s.trim()).filter(Boolean);
  const out=[];
  const re=/(.+?)([+\-＋－]?\d+(?:\.\d+)?)(?:\s*(?:元|块|rmb|RMB|cny|CNY|¥|￥))?(?=\s+[^0-9+\-＋－¥￥]*[+\-＋－]?\d|$)/g;
  parts.forEach(part=>{
    let m;re.lastIndex=0;
    while((m=re.exec(part))){
      const signAmt=m[2].replace('＋','+').replace('－','-');
      if(m[1].trim()&&parseFloat(signAmt)!==0)out.push({text:(m[1]+m[2]).trim(),amountText:signAmt});
    }
  });
  return out;
}
function splitReimbEntries(raw){
  const normalized=raw.replace(/[，,；;、|/·\n]+/g,';').replace(/\s+/g,' ').trim();
  const parts=normalized.split(';').map(s=>s.trim()).filter(Boolean);
  const out=[];
  const re=/(.+?)([+\-＋－]?\d+(?:\.\d+)?)([^0-9+\-＋－]*?)(?=\s+[^0-9+\-＋－]*[+\-＋－]?\d|$)/g;
  parts.forEach(part=>{
    let m;re.lastIndex=0;
    while((m=re.exec(part))){
      const signAmt=m[2].replace('＋','+').replace('－','-');
      if(m[1].trim()&&parseFloat(signAmt)!==0)out.push({text:(m[1]+m[2]+(m[3]||'')).trim(),amountText:signAmt});
    }
  });
  return out;
}
function cleanQuickLabel(text,amountText){
  return text
    .replace(amountText,'')
    .replace(/(20\d{2})[年\-\/.]\d{1,2}[月\-\/.]\d{1,2}[日号]?/g,'')
    .replace(/\d{1,2}[月\/.]\d{1,2}[日号]?/g,'')
    .replace(/大前天|前天|昨天|昨日|今天|今日/g,'')
    .replace(/([01]?\d|2[0-3])[:：点]\d{0,2}/g,'')
    .replace(/报销|支出|花了|收入|收到|收款|入账|到账|赚了/g,'')
    .replace(/[元块￥¥+＋\-－]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function quickKind(text,amountText){
  if(amountText.startsWith('+'))return 'income';
  if(amountText.startsWith('-'))return 'expense';
  if(/报销/.test(text)&&!/(报销收|报销到账|报销款|收到报销|报销已到|已报销)/.test(text))return 'reimbursement';
  return autoType(text);
}

function cellColor(net,budget){
  if(!net||Math.abs(net)<0.5)return{bg:'#f0f0f0',txt:'#1a1a1a'}
  if(net>0){const g=Math.min(1,net/(budget||50)/2);const l=Math.round(240-g*80);return{bg:`rgb(${Math.round(200-g*80)},${Math.min(255,l)},${Math.round(200-g*80)})`,txt:'#fff'}}
  const ratio=Math.abs(net)/(budget||50);
  if(ratio<0.3)return{bg:'#FFCDD2',txt:'#b71c1c'}
  if(ratio<0.7)return{bg:'#EF9A9A',txt:'#fff'}
  if(ratio<1.2)return{bg:'#e53935',txt:'#fff'}
  return{bg:'#B71C1C',txt:'#fff'}
}

function applyImportedState(raw){
  const data=raw?.data||raw;
  if(!data||(!Array.isArray(data.records)&&!Array.isArray(data.reimbs)))throw new Error('bad backup');
  const next=ld();
  next.setupDone=true;
  next.settings=data.settings||next.settings||ST||{};
  next.records=Array.isArray(data.records)?data.records:[];
  next.reimbs=Array.isArray(data.reimbs)?data.reimbs:[];
  next.goals=Array.isArray(data.goals)?data.goals:(next.goals||[]);
  next.lastImportAt=new Date().toISOString();
  sv(next);ST=next.settings;RC=next.records;RM=next.reimbs;
}

function settleDay(){const v=parseInt(ST?.settleDay||1,10);return Math.min(31,Math.max(1,v||1))}
function settleDate(y,m,d){const dim=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(d,dim))}
function daysBetween(a,b){return Math.floor((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)+1}
function periodBounds(asOf=todayStr()){
  const d=new Date(asOf+'T00:00:00');const sd=settleDay();
  let start=settleDate(d.getFullYear(),d.getMonth(),sd);
  if(d<start)start=settleDate(d.getFullYear(),d.getMonth()-1,sd);
  const next=settleDate(start.getFullYear(),start.getMonth()+1,sd);next.setDate(next.getDate()-1);
  return{start:dateStr(start),end:dateStr(next),settleDay:sd};
}
function budgetState(asOf=todayStr()){
  if(ST.purpose==='record')return null;
  const p=periodBounds(asOf);
  const daily=parseFloat(ST.budget)||0;
  const extra=ST.hasExtra?(parseFloat(ST.extraAmount)||0):0;
  const previous=ST.hasPrevBalance?(parseFloat(ST.prevBalance)||0):0;
  const start=p.start;
  const recs=RC.filter(r=>r.date>=start&&r.date<=asOf);
  const todayRecs=RC.filter(r=>r.date===asOf);
  const spent=recs.filter(r=>r.type==='expense').reduce((a,r)=>a+r.amount,0);
  const earned=recs.filter(r=>r.type==='income').reduce((a,r)=>a+r.amount,0);
  const todaySpent=todayRecs.filter(r=>r.type==='expense').reduce((a,r)=>a+r.amount,0);
  const todayEarned=todayRecs.filter(r=>r.type==='income').reduce((a,r)=>a+r.amount,0);
  const days=Math.max(1,daysBetween(start,asOf));
  const accrued=daily*days;
  const added=previous+extra+(ST.income_merge==='yes'?earned:0);
  const balance=accrued+added-spent;
  const dailyRemaining=daily-todaySpent;
  const periodDays=Math.max(1,daysBetween(p.start,p.end));
  const daysRemain=Math.max(0,daysBetween(asOf,p.end)-1);
  return{periodStart:p.start,periodEnd:p.end,settleDay:p.settleDay,calcStart:start,daily,extra,previous,spent,earned,todaySpent,todayEarned,dailyRemaining,days,accrued,added,balance,periodDays,daysRemain,periodTotal:daily*periodDays};
}

function invoiceInfo(t){
  const reimbursed=/已报销|报销完成|已到账/.test(t);
  if(/没发票|无发票|没有发票/.test(t))return{hasInvoice:false,invoiceStatus:'无发票',reimbursed};
  if(/已拿到|拿到发票|发票到手/.test(t))return{hasInvoice:true,invoiceStatus:'已拿到',reimbursed};
  if(/已开票|开票了|发票已开|有发票/.test(t))return{hasInvoice:true,invoiceStatus:'已开',reimbursed};
  if(/没开票|没开发票|未开票|待开票/.test(t))return{hasInvoice:true,invoiceStatus:'未开',reimbursed};
  return{hasInvoice:false,invoiceStatus:'无发票',reimbursed};
}
function cleanReimbLabel(text,amountText){
  return cleanQuickLabel(text,amountText).replace(/没发票|无发票|没有发票|已拿到|拿到发票|发票到手|已开票|开票了|发票已开|有发票|没开票|没开发票|未开票|待开票|已报销|报销完成|已到账/g,'').trim();
}
function reimbMatchFilter(r){
  if(reimbFilter==='all')return true;
  if(reimbFilter==='done')return !!r.reimbursed;
  if(reimbFilter==='noinv')return !r.hasInvoice;
  if(reimbFilter==='unissued')return !!r.hasInvoice&&(r.invoiceStatus||'未开')==='未开'&&!r.reimbursed;
  if(reimbFilter==='issued')return !!r.hasInvoice&&['已开','已拿到'].includes(r.invoiceStatus)&&!r.reimbursed;
  return true;
}

function buildDayMap(){
  const m={};
  RC.forEach(r=>{if(!m[r.date])m[r.date]={out:0,in:0};if(r.type==='expense')m[r.date].out+=r.amount;else if(r.type==='income')m[r.date].in+=r.amount;});
  return m;
}
function calCellsHtml(prefix,clickFn,selD){
  const now=new Date();const yr=now.getFullYear(),mo=now.getMonth();
  const firstDay=new Date(yr,mo,1).getDay()||7;
  const dim=new Date(yr,mo+1,0).getDate();
  const todS=todayStr();const dayMap=buildDayMap();
  const budget=parseFloat(ST.budget)||50;
  const off=firstDay===7?0:firstDay-1;
  let html='';
  for(let i=0;i<off;i++)html+=`<div class="${prefix}cc emp"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=yr+'-'+pad2(mo+1)+'-'+pad2(d);
    const dm=dayMap[ds];const isToday=ds===todS;const isSel=ds===selD;
    let bg='#f0f0f0',txt='#1a1a1a',netTxt='';
    if(isToday){bg='#378ADD';txt='#fff';}
    else if(dm){const net=dm.in-dm.out;if(Math.abs(net)>=0.5){const c=cellColor(net,budget);bg=c.bg;txt=c.txt;netTxt=`<span class="${prefix}cn" style="color:${txt};opacity:.9">${net<0?'-':'+'}${Math.round(Math.abs(net))}</span>`;}}
    const selStyle=isSel&&!isToday?'outline:2px solid #378ADD;':'';
    html+=`<div class="${prefix}cc" style="background:${bg};${selStyle}" onclick="${clickFn}('${ds}')"><span class="${prefix}cd" style="color:${txt}">${d}</span>${netTxt}</div>`;
  }
  return html;
}

  }
  ds.innerHTML=`<div class="detail-bar"><button class="back-btn" onclick="showApp()">←</button><div class="detail-title">${title}</div></div><div class="detail-body">${body}</div>${detailView==='reimb'?reimbQuickInputHtml('ri-detail'):quickInputHtml('qi-detail')}`;
  if(detailView==='pie'){setTimeout(()=>{const catSpend={};RC.filter(r=>r.type==='expense').forEach(r=>{catSpend[r.cat]=(catSpend[r.cat]||0)+r.amount});const entries=Object.entries(catSpend).sort((a,b)=>b[1]-a[1]);const pc=document.getElementById('d-pie');if(pc&&entries.length&&window.Chart)charts.dpie=new Chart(pc,{type:'doughnut',data:{labels:entries.map(e=>e[0]),datasets:[{data:entries.map(e=>e[1]),backgroundColor:PIE_COLORS,borderWidth:0}]},options:{cutout:'60%',plugins:{legend:{display:false},tooltip:{enabled:false}},animation:{duration:400}}});},30);}
  checkModal();
}
function detailSelDay(ds){detailSel=ds;selDate=ds;renderDetail()}
function checkModal(){
  document.getElementById('shell').querySelectorAll('.modal-overlay').forEach(e=>e.remove());
  if(modal==='add')renderAddModal();
  else if(modal==='edit')renderEditModal();
  else if(modal==='reimb-add')renderReimbAddModal();
  else if(modal==='reimb-edit')renderReimbEditModal();
  else if(modal==='data')renderDataModal();
}
function mkOverlay(){const ov=document.createElement('div');ov.className='modal-overlay';ov.addEventListener('click',e=>{if(e.target===ov){modal=null;detailView?renderDetail():showApp()}});return ov;}
function mTypeBtns(){return `<button class="mtbtn${mType==='expense'?' so':''}" onclick="setMType('expense')">− 支出</button><button class="mtbtn${mType==='income'?' si':''}" onclick="setMType('income')">+ 收入</button>`}
function mCatsHtml(){const cats=mType==='income'?ICATS:ECATS;return cats.map(c=>`<div class="mcat${mCat===c.k?' sel':''}" onclick="setMCat('${c.k}')">${c.i} ${c.k}</div>`).join('')}
function openAdd(){selDate=currentEntryDate();modal='add';mType='expense';mCat='餐饮';mTs=null;detailView?renderDetail():showApp()}
function openEdit(ts){mTs=ts;modal='edit';const r=RC.find(r=>r.ts===ts);if(!r)return;mType=r.type;mCat=r.cat;detailView?renderDetail():showApp()}
function openReimbAdd(){modal='reimb-add';mTs=null;tmpR={hasInvoice:false,invoiceStatus:'未开',reimbursed:false,deadline:'',cat:'其他'};detailView?renderDetail():showApp()}
function openReimbEdit(ts){mTs=ts;modal='reimb-edit';const r=RM.find(r=>r.ts===ts);if(!r)return;tmpR={hasInvoice:r.hasInvoice||false,invoiceStatus:r.invoiceStatus||'未开',reimbursed:r.reimbursed||false,deadline:r.deadline||'',cat:r.cat||'其他'};detailView?renderDetail():showApp()}
function openDataCenter(){modal='data';detailView?renderDetail():showApp()}
function openSettings(){qStep=0;qAns=Object.assign({},ST||{});modal=null;detailView=null;showQuiz()}
function renderDataModal(){const c=dataCounts();const ov=mkOverlay();ov.innerHTML=`<div class="modal-sheet"><div class="mhandle"></div><div class="mtitle">数据中心</div><div class="data-note">当前共有 ${c.total} 条数据：流水 ${c.records} 条，报销 ${c.reimbs} 条。更新版本前先导出备份，新版本打开后可导入恢复。</div><div class="data-actions"><button class="data-btn primary" onclick="exportData()">导出备份</button><button class="data-btn" onclick="triggerImport()">导入备份</button></div><input id="backup-file" type="file" accept="application/json,.json" style="display:none" onchange="importDataFile(this)"><div class="sumcard"><div class="sumrow"><span class="sumk">保存位置</span><span class="sumv">本机浏览器</span></div><div class="sumrow"><span class="sumk">最后备份</span><span class="sumv">${c.lastBackup?c.lastBackup.slice(0,10):'未记录'}</span></div><div class="sumrow"><span class="sumk">备份格式</span><span class="sumv">JSON 文件</span></div></div></div>`;document.getElementById('shell').appendChild(ov);}
function renderAddModal(){const ov=mkOverlay();ov.innerHTML=`<div class="modal-sheet"><div class="mhandle"></div><div class="mtitle">新增记录</div><div class="mtype-row">${mTypeBtns()}</div><div class="mcats" id="mc">${mCatsHtml()}</div><div class="mfields"><div class="mfield"><span class="mflbl">备注</span><input id="mn" placeholder="发生了什么..."></div><div class="mfield"><span class="mflbl">¥ 金额</span><input id="ma" type="number" placeholder="0.00" min="0" step="0.01"></div><div class="mfield"><span class="mflbl">日期</span><input id="md" type="date" value="${currentEntryDate()}"></div><div class="mfield"><span class="mflbl">时间</span><input id="mt" type="time" value="${nowStr()}"></div></div><button class="msub" onclick="submitAdd()">记录</button></div>`;document.getElementById('shell').appendChild(ov);}
function renderEditModal(){const r=RC.find(r=>r.ts===mTs);if(!r)return;const ov=mkOverlay();ov.innerHTML=`<div class="modal-sheet"><div class="mhandle"></div><div class="mtitle">编辑记录</div><div class="mtype-row">${mTypeBtns()}</div><div class="mcats" id="mc">${mCatsHtml()}</div><div class="mfields"><div class="mfield"><span class="mflbl">备注</span><input id="mn" value="${r.label}"></div><div class="mfield"><span class="mflbl">¥ 金额</span><input id="ma" type="number" min="0" step="0.01" value="${r.amount}"></div><div class="mfield"><span class="mflbl">日期</span><input id="md" type="date" value="${r.date||selDate}"></div><div class="mfield"><span class="mflbl">时间</span><input id="mt" type="time" value="${normalizeTime(r.time||nowStr())}"></div></div><button class="msub" onclick="submitEdit()">保存修改</button><button class="mdel" onclick="delRec(${r.ts})">删除这条记录</button></div>`;document.getElementById('shell').appendChild(ov);}
function invOpts(cur){return['未开','已开','已拿到'].map(s=>`<div class="mreimb-opt${cur===s?' sel':''}" onclick="setInvSt('${s}')">${s}</div>`).join('')}
function renderReimbAddModal(){const ov=mkOverlay();ov.innerHTML=`<div class="modal-sheet"><div class="mhandle"></div><div class="mtitle">新增报销</div><div class="mcats" id="mc-r">${RCATS.map(c=>`<div class="mcat${tmpR.cat===c.k?' sel':''}" onclick="setRC('${c.k}')">${c.i} ${c.k}</div>`).join('')}</div><div class="mfields"><div class="mfield"><span class="mflbl">名称</span><input id="rn" placeholder="报销事由..."></div><div class="mfield"><span class="mflbl">¥ 金额</span><input id="ra" type="number" placeholder="0.00" min="0" step="0.01"></div><div class="mfield"><span class="mflbl">日期</span><input id="rdate" type="date" value="${currentEntryDate()}"></div><div class="mfield"><span class="mflbl">截止日</span><input id="rd" type="date" value="${tmpR.deadline}"></div></div><div class="mreimb-sec"><div class="mreimb-sec-title">发票状态</div><div class="mreimb-row"><span class="mreimb-lbl">有发票</span><div class="mreimb-opts"><div class="mreimb-opt${!tmpR.hasInvoice?' sel':''}" onclick="setHasInv(false)">没有</div><div class="mreimb-opt${tmpR.hasInvoice?' sel':''}" onclick="setHasInv(true)">有</div></div></div><div class="mreimb-row" id="inv-row" style="${tmpR.hasInvoice?'':'display:none'}"><span class="mreimb-lbl">开票进度</span><div class="mreimb-opts" id="inv-opts">${invOpts(tmpR.invoiceStatus)}</div></div></div><button class="msub" onclick="submitReimbAdd()">记录报销</button></div>`;document.getElementById('shell').appendChild(ov);}
function renderReimbEditModal(){const r=RM.find(r=>r.ts===mTs);if(!r)return;const ov=mkOverlay();ov.innerHTML=`<div class="modal-sheet"><div class="mhandle"></div><div class="mtitle">编辑报销</div><div class="mcats" id="mc-r">${RCATS.map(c=>`<div class="mcat${tmpR.cat===c.k?' sel':''}" onclick="setRC('${c.k}')">${c.i} ${c.k}</div>`).join('')}</div><div class="mfields"><div class="mfield"><span class="mflbl">名称</span><input id="rn" value="${r.name}"></div><div class="mfield"><span class="mflbl">¥ 金额</span><input id="ra" type="number" min="0" step="0.01" value="${r.amount}"></div><div class="mfield"><span class="mflbl">日期</span><input id="rdate" type="date" value="${r.date||selDate}"></div><div class="mfield"><span class="mflbl">截止日</span><input id="rd" type="date" value="${r.deadline||''}"></div></div><div class="mreimb-sec"><div class="mreimb-sec-title">发票状态</div><div class="mreimb-row"><span class="mreimb-lbl">有发票</span><div class="mreimb-opts"><div class="mreimb-opt${!tmpR.hasInvoice?' sel':''}" onclick="setHasInv(false)">没有</div><div class="mreimb-opt${tmpR.hasInvoice?' sel':''}" onclick="setHasInv(true)">有</div></div></div><div class="mreimb-row" id="inv-row" style="${tmpR.hasInvoice?'':'display:none'}"><span class="mreimb-lbl">开票进度</span><div class="mreimb-opts" id="inv-opts">${invOpts(tmpR.invoiceStatus)}</div></div></div><button class="mark-reimb-btn${r.reimbursed?' done':''}" onclick="toggleReimbDone(${r.ts})">${r.reimbursed?'✓ 已报销（点击撤销）':'标记为已报销'}</button><button class="msub" onclick="submitReimbEdit()">保存修改</button><button class="mdel" onclick="delReimb(${r.ts})">删除</button></div>`;document.getElementById('shell').appendChild(ov);}
function setMType(t){mType=t;mCat=(t==='income'?ICATS:ECATS)[0].k;document.getElementById('mc').innerHTML=mCatsHtml();document.querySelectorAll('.mtbtn').forEach((b,i)=>{b.className='mtbtn'+(i===0&&t==='expense'?' so':i===1&&t==='income'?' si':'')})}
function setMCat(k){mCat=k;document.getElementById('mc')?.querySelectorAll('.mcat').forEach(el=>el.classList.toggle('sel',el.textContent.trim().includes(k)))}
function setRC(k){tmpR.cat=k;document.getElementById('mc-r')?.querySelectorAll('.mcat').forEach(el=>el.classList.toggle('sel',el.textContent.trim().includes(k)))}
function setHasInv(v){tmpR.hasInvoice=v;document.querySelectorAll('.mreimb-opt').forEach(el=>{if(el.textContent==='没有')el.classList.toggle('sel',!v);if(el.textContent==='有')el.classList.toggle('sel',v)});const row=document.getElementById('inv-row');if(row)row.style.display=v?'':'none'}
function setInvSt(s){tmpR.invoiceStatus=s;document.getElementById('inv-opts')?.querySelectorAll('.mreimb-opt').forEach(el=>el.classList.toggle('sel',el.textContent===s))}
function submitAdd(){const note=document.getElementById('mn')?.value.trim()||'记录';const amt=parseFloat(document.getElementById('ma')?.value);const date=document.getElementById('md')?.value||currentEntryDate();const time=normalizeTime(document.getElementById('mt')?.value||nowStr());if(!amt||amt<=0){showToast('请输入有效金额');return;}RC.push({type:mType,amount:amt,label:note,cat:mCat,date,time,ts:makeTs(date,time)});selDate=date;detailSel=date;saveState();modal=null;detailView?renderDetail():showApp()}
function submitEdit(){const note=document.getElementById('mn')?.value.trim()||'记录';const amt=parseFloat(document.getElementById('ma')?.value);const date=document.getElementById('md')?.value||selDate;const time=normalizeTime(document.getElementById('mt')?.value||nowStr());if(!amt||amt<=0){showToast('请输入有效金额');return;}const idx=RC.findIndex(r=>r.ts===mTs);if(idx>=0)RC[idx]={...RC[idx],type:mType,amount:amt,label:note,cat:mCat,date,time,ts:makeTs(date,time)};selDate=date;detailSel=date;saveState();modal=null;detailView?renderDetail():showApp()}
function delRec(ts){RC=RC.filter(r=>r.ts!==ts);saveState();modal=null;detailView?renderDetail():showApp()}
function submitReimbAdd(){const name=document.getElementById('rn')?.value.trim()||'报销';const amt=parseFloat(document.getElementById('ra')?.value);const date=document.getElementById('rdate')?.value||currentEntryDate();const deadline=document.getElementById('rd')?.value||'';const time=nowStr();if(!amt||amt<=0){showToast('请输入有效金额');return;}RM.push({name,amount:amt,date,time,ts:makeTs(date,time),hasInvoice:tmpR.hasInvoice,invoiceStatus:tmpR.invoiceStatus,reimbursed:false,deadline,cat:tmpR.cat});selDate=date;detailSel=date;saveState();modal=null;detailView?renderDetail():showApp()}
function submitReimbEdit(){const name=document.getElementById('rn')?.value.trim()||'报销';const amt=parseFloat(document.getElementById('ra')?.value);const date=document.getElementById('rdate')?.value||selDate;const deadline=document.getElementById('rd')?.value||'';if(!amt||amt<=0){showToast('请输入有效金额');return;}const idx=RM.findIndex(r=>r.ts===mTs);if(idx>=0)Object.assign(RM[idx],{name,amount:amt,date,deadline,hasInvoice:tmpR.hasInvoice,invoiceStatus:tmpR.invoiceStatus,cat:tmpR.cat,ts:makeTs(date,RM[idx].time||nowStr())});selDate=date;detailSel=date;saveState();modal=null;detailView?renderDetail():showApp()}
function delReimb(ts){RM=RM.filter(r=>r.ts!==ts);saveState();modal=null;detailView?renderDetail():showApp()}
function toggleReimbDone(ts){const idx=RM.findIndex(r=>r.ts===ts);if(idx>=0)RM[idx].reimbursed=!RM[idx].reimbursed;saveState();modal=null;detailView?renderDetail():showApp()}
function quickAddReimb(inputId='ri-detail'){
  const inp=typeof inputId==='string'?document.getElementById(inputId):inputId;const raw=inp?.value.trim();if(!raw)return;
  const entries=splitReimbEntries(raw);if(!entries.length){openReimbAdd();return;}
  const globalDate=leadingDateHint(raw)||currentEntryDate();const baseNow=nowStr();let added=0,lastDate=globalDate;
  entries.forEach((e,i)=>{
    const amount=Math.abs(parseFloat(e.amountText));if(!amount)return;
    const date=dateHint(e.text)||globalDate;const time=normalizeTime(timeHint(e.text)||baseNow);
    const inv=invoiceInfo(e.text);const label=cleanReimbLabel(e.text,e.amountText)||'报销';
    const cat=autoCat(label,'reimbursement');
    RM.push({name:label,amount,date,time,ts:makeTs(date,time,i),hasInvoice:inv.hasInvoice,invoiceStatus:inv.invoiceStatus,reimbursed:inv.reimbursed,deadline:'',cat});
    added++;lastDate=date;
  });
  if(!added){showToast('没有识别到有效金额');return;}
  selDate=lastDate;detailSel=lastDate;saveState();inp.value='';renderDetail();
}
function quickAdd(inputId='qi-app'){
  const inp=typeof inputId==='string'?document.getElementById(inputId):inputId;const raw=inp?.value.trim();if(!raw)return;
  const entries=raw.includes('报销')?splitReimbEntries(raw):splitQuickEntries(raw);if(!entries.length){openAdd();return;}
  const globalDate=leadingDateHint(raw)||currentEntryDate();const baseNow=nowStr();let added=0,lastDate=globalDate;
  entries.forEach((e,i)=>{
    const amount=Math.abs(parseFloat(e.amountText));if(!amount)return;
    const kind=quickKind(e.text,e.amountText);
    const date=dateHint(e.text)||globalDate;
    const time=normalizeTime(timeHint(e.text)||baseNow);
    if(kind==='reimbursement'){
      const inv=invoiceInfo(e.text);const label=cleanReimbLabel(e.text,e.amountText)||'报销';
      const cat=autoCat(label,'reimbursement');
      RM.push({name:label,amount,date,time,ts:makeTs(date,time,i),hasInvoice:inv.hasInvoice,invoiceStatus:inv.invoiceStatus,reimbursed:inv.reimbursed,deadline:'',cat});
    }else{
      const label=cleanQuickLabel(e.text,e.amountText)||'记录';
      const type=kind;const cat=autoCat(label,type);
      RC.push({type,amount,label,cat,date,time,ts:makeTs(date,time,i)});
    }
    added++;lastDate=date;
  });
  if(!added){showToast('没有识别到有效金额');return;}
  selDate=lastDate;detailSel=lastDate;saveState();inp.value='';detailView?renderDetail():showApp();
}

const s=ld();
if(s.setupDone&&s.settings?.purpose==='budget'&&!s.settings.settleDay){qAns={...s.settings,budget:'',settleDay:1};RC=s.records||[];RM=s.reimbs||[];showQuiz();}
else if(s.setupDone){ST=s.settings||{};RC=s.records||[];RM=s.reimbs||[];showApp();}
else{showQuiz();}
</script>
</body>
