<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>记账日记 - 财务管家</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#f0f0f5}
.shell{max-width:390px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#f0f0f5}
.quiz-wrap{flex:1;display:flex;flex-direction:column;padding:28px 20px 20px;background:#fff;overflow-y:auto}
.pdots{display:flex;gap:5px;margin-bottom:22px}
.pdot{flex:1;height:4px;border-radius:2px;background:#e0dfd8}
.pdot.done{background:#378ADD}.pdot.active{background:#85B7EB}
.qemoji{font-size:30px;margin-bottom:8px;display:block}
.qtitle{font-size:18px;font-weight:600;color:#1a1a1a;line-height:1.4;margin-bottom:4px}
.qsub{font-size:12px;color:#888;margin-bottom:18px;line-height:1.6}
.qopts{display:flex;flex-direction:column;gap:8px;flex:1}
.qopt{padding:12px 14px;border-radius:14px;border:1.5px solid #e8e8e8;background:#fff;cursor:pointer;text-align:left;transition:all .12s}
.qopt:hover{background:#f5f5f5}
.qopt.sel{border-color:#378ADD;background:#EBF4FF}
.qopt-t{font-size:13px;font-weight:600;color:#1a1a1a}
.qopt.sel .qopt-t{color:#0C447C}
.qopt-s{font-size:11px;color:#999;margin-top:2px}
.qopt.sel .qopt-s{color:#378ADD}
.amtbox{background:#f7f7f7;border:1.5px solid #e8e8e8;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.amtbox:focus-within{border-color:#378ADD}
.amtsym{font-size:18px;font-weight:600;color:#999}
.amtin{flex:1;background:none;border:none;outline:none;font-size:22px;font-weight:600;color:#1a1a1a;-moz-appearance:textfield}
.amtin::-webkit-outer-spin-button,.amtin::-webkit-inner-spin-button{-webkit-appearance:none}
.amtunit{font-size:12px;color:#999}
.tog{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:12px;border:1.5px solid #e8e8e8;background:#f7f7f7;cursor:pointer;margin-bottom:8px;transition:all .12s}
.tog.on{border-color:#378ADD;background:#EBF4FF}
.tog-lbl{font-size:13px;font-weight:500;color:#1a1a1a}
.tog.on .tog-lbl{color:#0C447C}
.togpill{width:34px;height:19px;border-radius:10px;background:#ccc;position:relative;flex-shrink:0;transition:background .2s}
.togpill.on{background:#378ADD}
.togpill::after{content:'';position:absolute;top:2.5px;left:2.5px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.togpill.on::after{transform:translateX(15px)}
.navrow{display:flex;gap:8px;margin-top:16px}
.btnback{flex:0 0 42px;height:42px;border-radius:12px;border:1.5px solid #e8e8e8;background:#f7f7f7;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#666;font-size:16px}
.btnnext{flex:1;height:42px;border-radius:12px;border:none;background:#378ADD;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background .12s}
.btnnext:hover{background:#185FA5}
.btnnext:disabled{background:#ccc;cursor:default}
.sumcard{background:#f7f7f7;border-radius:12px;padding:14px;margin-bottom:12px}
.sumrow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:0.5px solid #e8e8e8}
.sumrow:last-child{border-bottom:none}
.sumk{font-size:12px;color:#888}
.sumv{font-size:12px;font-weight:600;color:#1a1a1a}
.finbtn{width:100%;height:46px;border-radius:14px;border:none;background:#378ADD;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.app-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.appbar{padding:12px 16px 10px;background:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid #e8e8e8;flex-shrink:0}
.apptitle{font-size:16px;font-weight:700;color:#1a1a1a}
.app-actions{display:flex;gap:6px;align-items:center}
.settbtn{font-size:11px;color:#378ADD;background:none;border:1px solid #a8cdf0;border-radius:8px;padding:4px 10px;cursor:pointer}
.scroll-body{flex:1;overflow-y:auto;padding:10px 10px 0;-webkit-overflow-scrolling:touch}
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.card{background:#fff;border-radius:14px;padding:10px 10px 8px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.06);transition:box-shadow .15s}
.card:active{box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.card-title{font-size:11px;font-weight:600;color:#888;letter-spacing:.03em}
.card-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px}
.card-expand{font-size:10px;color:#378ADD}
/* 日历小卡 */
.mini-cal-wrow{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:2px}
.mini-wl{font-size:8px;color:#aaa;text-align:center}
.mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1.5px}
.mcc{aspect-ratio:1;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.mcc.emp{background:transparent!important}
.mcd{font-size:9px;font-weight:600;line-height:1}
.mcn{font-size:7px;line-height:1;margin-top:1px}
.cal-footer{display:flex;justify-content:space-between;margin-top:6px;padding-top:5px;border-top:.5px solid #f0f0f0}
.cal-footer-item{text-align:center;flex:1}
.cal-footer-v{font-size:11px;font-weight:600;color:#1a1a1a}
.cal-footer-l{font-size:9px;color:#aaa;margin-top:1px}
/* 预算环形卡 */
.ring-area{display:flex;flex-direction:column;align-items:center;position:relative}
.ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);text-align:center;pointer-events:none}
.ring-center-pct{font-size:13px;font-weight:700;color:#1a1a1a;line-height:1}
.ring-center-lbl{font-size:8px;color:#aaa;margin-top:1px}
.ring-nums{display:flex;justify-content:space-between;width:100%;margin-top:5px}
.rnum{text-align:center}
.rnum-v{font-size:11px;font-weight:700}
.rnum-l{font-size:9px;color:#aaa;margin-top:1px}
.budget-predict{font-size:9px;color:#aaa;text-align:center;margin-top:4px;padding-top:4px;border-top:.5px solid #f0f0f0;width:100%}
.budget-predict.warn{color:#e65100}
.budget-predict.over{color:#c62828}
/* 报销卡 */
.pie-area{display:flex;flex-direction:column;align-items:center}
.pie-legend{width:100%;margin-top:5px}
.pli{display:flex;align-items:center;gap:4px;margin-bottom:2px}
.pld{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pll{font-size:9px;color:#888;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pla{font-size:9px;font-weight:600;color:#1a1a1a}
.reimb-stat{display:flex;justify-content:space-around;margin-bottom:5px}
.rs-item{text-align:center}
.rs-v{font-size:12px;font-weight:700}
.rs-l{font-size:9px;color:#aaa;margin-top:1px}
.reimb-mini-row{display:flex;align-items:center;gap:4px;padding:3px 0;border-bottom:.5px solid #f0f0f0}
.reimb-mini-row:last-child{border-bottom:none}
.rmr-name{font-size:10px;color:#1a1a1a;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmr-name.done{text-decoration:line-through;color:#aaa}
.rmr-amt{font-size:10px;font-weight:600;color:#185FA5}
.rmr-dl{font-size:9px;padding:1px 5px;border-radius:4px;background:#FFF3E0;color:#E65100;flex-shrink:0}
.reimb-footer{margin-top:5px;padding-top:5px;border-top:.5px solid #f0f0f0;font-size:10px;color:#aaa;text-align:center}
.reimb-footer.ok{color:#2e7d32}
/* 流水 */
.feed-section{background:#fff;border-radius:14px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.feed-group{}
.feed-dh{display:flex;align-items:center;justify-content:space-between;padding:9px 12px 5px}
.feed-dlbl{font-size:12px;font-weight:600;color:#888}
.feed-dsub{display:flex;gap:8px}
.feed-din{font-size:11px;color:#2e7d32;font-weight:500}
.feed-dout{font-size:11px;color:#c62828;font-weight:500}
.feed-entry{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.feed-entry:active{background:#f9f9f9}
.ficon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.fbody{flex:1;min-width:0}
.fname{font-size:13px;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.fname.rdone{text-decoration:line-through;color:#aaa}
.fmeta{display:flex;gap:5px;align-items:center;margin-top:2px}
.ftag{font-size:10px;padding:1px 5px;border-radius:4px;font-weight:500}
.ftime{font-size:10px;color:#bbb}
.famt{font-size:14px;font-weight:700;flex-shrink:0}
.famt.out{color:#c62828}.famt.in{color:#2e7d32}.famt.reimb{color:#185FA5}
.fdone-lbl{font-size:9px;color:#aaa;flex-shrink:0}
.empty-feed{text-align:center;color:#bbb;font-size:12px;padding:24px 0}
/* 输入框 */
.input-bar{background:#fff;border-top:.5px solid #e8e8e8;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;flex-shrink:0}
.qinput{flex:1;height:36px;background:#f5f5f5;border:1px solid #e8e8e8;border-radius:18px;padding:0 14px;font-size:13px;color:#1a1a1a;outline:none;transition:border-color .15s}
.qinput:focus{border-color:#378ADD;background:#fff}
.qinput::placeholder{color:#bbb}
.addbtn{width:36px;height:36px;border-radius:50%;background:#378ADD;border:none;cursor:pointer;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(55,138,221,.4);-webkit-tap-highlight-color:transparent}
/* 提示 */
.input-hint{font-size:11px;padding:2px 14px 0;height:16px;transition:color .15s}
.input-hint.income{color:#2e7d32}
.input-hint.expense{color:#aaa}
.toast{position:absolute;left:50%;bottom:68px;transform:translateX(-50%);background:rgba(20,20,20,.86);color:#fff;font-size:12px;padding:8px 14px;border-radius:18px;z-index:160;white-space:nowrap;pointer-events:none}
/* 详情页 */
.detail-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#f0f0f5}
.detail-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:.5px solid #e8e8e8;flex-shrink:0}
.back-btn{width:32px;height:32px;border-radius:9px;border:1px solid #e8e8e8;background:#f7f7f7;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#666;-webkit-tap-highlight-color:transparent}
.detail-title{font-size:15px;font-weight:700;color:#1a1a1a}
.detail-body{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
/* 大日历 */
.big-cal-wrow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.big-wl{font-size:11px;color:#aaa;text-align:center;padding:2px 0}
.big-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:10px}
.bcc{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bcc.emp{background:transparent!important}
.bcd{font-size:14px;font-weight:600;line-height:1}
.bcn{font-size:9px;line-height:1;margin-top:2px}
.day-feed-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.day-feed-lbl{font-size:13px;font-weight:600;color:#1a1a1a}
.day-feed-sub{display:flex;gap:8px}
.big-entry{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;background:#fff;margin-bottom:4px;-webkit-tap-highlight-color:transparent}
.big-entry:active{background:#f5f5f5}
/* 详情统计 */
.d-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.d-stat{background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.d-stat-v{font-size:16px;font-weight:700}
.d-stat-l{font-size:10px;color:#aaa;margin-top:3px}
.d-stat-sub{font-size:10px;color:#aaa;margin-top:2px}
.prog-wrap{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.prog-lbl{display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-bottom:6px}
.prog-bar-bg{height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.prog-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.breakdown{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.bdrow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:.5px solid #f0f0f0}
.bdrow:last-child{border-bottom:none}
.bdk{font-size:12px;color:#888}
.bdv{font-size:12px;font-weight:600;color:#1a1a1a}
/* 饼图详情 */
.d-pie-list{display:flex;flex-direction:column;gap:7px;background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.d-pie-row{display:flex;align-items:center;gap:8px}
.d-pie-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.d-pie-lbl{font-size:13px;color:#1a1a1a;flex:1}
.d-pie-bar-bg{width:60px;height:5px;background:#f0f0f0;border-radius:3px;overflow:hidden}
.d-pie-bar{height:100%;border-radius:3px}
.d-pie-amt{font-size:12px;font-weight:600;color:#1a1a1a;min-width:48px;text-align:right}
.d-pie-pct{font-size:10px;color:#aaa;min-width:26px;text-align:right}
.d-pie-sub{font-size:9px;color:#bbb;min-width:52px;text-align:right}
/* 报销详情 */
.reimb-alert{background:#FFF3E0;border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:11px;color:#E65100;display:flex;align-items:center;gap:6px}
.reimb-list{display:flex;flex-direction:column;gap:6px}
.reimb-item{background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);-webkit-tap-highlight-color:transparent}
.reimb-item:active{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.ri-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ri-name{font-size:13px;font-weight:600;color:#1a1a1a}
.ri-name.done{text-decoration:line-through;color:#aaa}
.ri-amt{font-size:14px;font-weight:700;color:#185FA5}
.ri-bot{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.rbadge{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:500}
.rbadge.inv{background:#e8f5e9;color:#2e7d32}
.rbadge.noinv{background:#f5f5f5;color:#888}
.rbadge.done{background:#ffebee;color:#c62828}
.ri-dl{font-size:10px;color:#aaa}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;margin-bottom:2px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{border:1px solid #e8e8e8;background:#fff;color:#888;border-radius:14px;padding:5px 10px;font-size:11px;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
.filter-chip.sel{border-color:#378ADD;background:#EBF4FF;color:#0C447C;font-weight:600}
/* 周报卡片 */
.report-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.rc-title{font-size:12px;font-weight:700;color:#888;letter-spacing:.04em;margin-bottom:10px}
.rc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.rc-item{text-align:center}
.rc-v{font-size:15px;font-weight:700}
.rc-v.out{color:#c62828}.rc-v.in{color:#2e7d32}.rc-v.neu{color:#1a1a1a}
.rc-l{font-size:10px;color:#aaa;margin-top:2px}
.rc-compare{font-size:11px;padding:4px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:3px}
.rc-compare.up{background:#ffebee;color:#c62828}
.rc-compare.down{background:#e8f5e9;color:#2e7d32}
.rc-compare.flat{background:#f5f5f5;color:#888}
.trend-bar-row{display:flex;align-items:flex-end;gap:3px;height:40px;margin-top:8px}
.trend-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.trend-bar{width:100%;border-radius:3px 3px 0 0;background:#E3F2FD;min-height:2px;transition:height .3s}
.trend-bar.today{background:#378ADD}
.trend-bar-lbl{font-size:8px;color:#bbb}
.top-cats{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.top-cat-row{display:flex;align-items:center;gap:8px}
.top-cat-icon{font-size:14px;width:22px;text-align:center}
.top-cat-name{font-size:12px;color:#1a1a1a;flex:1}
.top-cat-bar-bg{width:80px;height:4px;background:#f0f0f0;border-radius:2px;overflow:hidden}
.top-cat-bar{height:100%;border-radius:2px;background:#378ADD}
.top-cat-amt{font-size:11px;font-weight:600;color:#1a1a1a;min-width:44px;text-align:right}
/* 模态框 */
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.35);border-radius:inherit;display:flex;flex-direction:column;justify-content:flex-end;z-index:100}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;padding:16px 16px 24px;max-height:88%;overflow-y:auto}
.mhandle{width:32px;height:4px;border-radius:2px;background:#e0e0e0;margin:0 auto 14px}
.mtitle{font-size:15px;font-weight:700;color:#1a1a1a;margin-bottom:12px}
.mtype-row{display:flex;gap:6px;margin-bottom:10px}
.mtbtn{flex:1;padding:8px;border-radius:10px;border:1.5px solid #e8e8e8;background:transparent;font-size:12px;font-weight:600;cursor:pointer;color:#888;transition:all .12s;-webkit-tap-highlight-color:transparent}
.mtbtn.so{border-color:#e53935;background:#ffebee;color:#b71c1c}
.mtbtn.si{border-color:#43a047;background:#e8f5e9;color:#1b5e20}
.mcats{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.mcat{font-size:11px;padding:4px 9px;border-radius:16px;border:1px solid #e8e8e8;background:#f7f7f7;color:#888;cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent}
.mcat.sel{border-color:#378ADD;background:#EBF4FF;color:#0C447C}
.mfields{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.mfield{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#f7f7f7;border-radius:10px;border:.5px solid #e8e8e8}
.mflbl{font-size:11px;color:#aaa;width:36px;flex-shrink:0}
.mfield input{flex:1;background:none;border:none;outline:none;font-size:13px;color:#1a1a1a;font-family:inherit}
.msub{width:100%;height:42px;border-radius:12px;border:none;background:#378ADD;color:#fff;font-size:14px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mdel{width:100%;height:38px;border-radius:10px;border:none;background:#ffebee;color:#c62828;font-size:13px;font-weight:500;cursor:pointer;margin-top:6px;-webkit-tap-highlight-color:transparent}
.mreimb-sec{background:#f7f7f7;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.mreimb-sec-title{font-size:11px;font-weight:600;color:#aaa;margin-bottom:8px}
.mreimb-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:.5px solid #e8e8e8}
.mreimb-row:last-child{border-bottom:none}
.mreimb-lbl{font-size:12px;color:#1a1a1a}
.mreimb-opts{display:flex;gap:4px}
.mreimb-opt{font-size:10px;padding:3px 8px;border-radius:6px;border:1px solid #e8e8e8;background:#fff;cursor:pointer;color:#888;-webkit-tap-highlight-color:transparent}
.mreimb-opt.sel{border-color:#378ADD;background:#EBF4FF;color:#0C447C}

<body>

  <div id="quiz-screen" style="display:none;flex:1;flex-direction:column"></div>
  <div id="app-screen" class="app-wrap" style="display:none"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
const SK='bav7';
const PIE_COLORS=['#378ADD','#43a047','#D85A30','#7E57C2','#e53935','#F9A825','#5F5E5A','#00ACC1','#EC407A'];
const INCOME_KW=['收入','赚','兼职','打工','工资','红包','到账','卖','副业','奖金','返现','报销收','利息','提成','外快','接单','发工资','售出','出售'];
const ECATS=[{k:'餐饮',i:'🍜',bg:'#FFF3E0',tc:'#E65100'},{k:'交通',i:'🚌',bg:'#E3F2FD',tc:'#1565C0'},{k:'购物',i:'🛍',bg:'#FCE4EC',tc:'#880E4F'},{k:'娱乐',i:'🎬',bg:'#EDE7F6',tc:'#4527A0'},{k:'医疗',i:'💊',bg:'#FFEBEE',tc:'#B71C1C'},{k:'学习',i:'📚',bg:'#E8F5E9',tc:'#1B5E20'},{k:'零花',i:'🎯',bg:'#FFF8E1',tc:'#F57F17'},{k:'游戏',i:'🎮',bg:'#F3E5F5',tc:'#6A1B9A'},{k:'运动',i:'🏃',bg:'#E1F5FE',tc:'#0277BD'},{k:'其他',i:'📝',bg:'#F5F5F5',tc:'#424242'}];
const ICATS=[{k:'兼职',i:'💼',bg:'#E8F5E9',tc:'#1B5E20'},{k:'工资',i:'💰',bg:'#F1F8E9',tc:'#33691E'},{k:'红包',i:'🧧',bg:'#FCE4EC',tc:'#880E4F'},{k:'转账',i:'🔄',bg:'#E3F2FD',tc:'#1565C0'},{k:'其他',i:'📥',bg:'#EDE7F6',tc:'#4527A0'}];
const RCATS=[{k:'餐饮',i:'🍜',bg:'#FFF3E0',tc:'#E65100'},{k:'交通',i:'🚌',bg:'#E3F2FD',tc:'#1565C0'},{k:'住宿',i:'🏨',bg:'#EDE7F6',tc:'#4527A0'},{k:'办公',i:'💻',bg:'#E8F5E9',tc:'#1B5E20'},{k:'其他',i:'📋',bg:'#F5F5F5',tc:'#424242'}];
const CKWS={餐饮:['早餐','午餐','晚餐','宵夜','奶茶','咖啡','外卖','零食','饭','吃','喝','菜','面','汤','蛋糕','火锅','炒'],交通:['打车','地铁','公交','滴滴','出租','油','加油','停车','高铁','火车','机票','骑行'],购物:['买','超市','网购','淘宝','京东','衣服','鞋','包','化妆','护肤'],娱乐:['电影','ktv','唱歌','演唱会','门票','景点','旅游','玩'],医疗:['药','医院','看病','诊所'],学习:['书','课','培训','学费','文具','笔'],零花:['零花','零用','杂费'],游戏:['游戏','steam','手游','网游','充值','王者','原神'],运动:['运动','健身','跑步','羽毛球','篮球','游泳','瑜伽','健身房'],兼职:['兼职','打工','接单','外快','副业','卖'],工资:['工资','薪资','底薪'],红包:['红包','压岁','打赏'],转账:['转账','还款','还钱'],住宿:['酒店','宾馆','住宿','民宿','房费']};

function ld(){try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){return{}}}
function sv(d){localStorage.setItem(SK,JSON.stringify(d))}
function pad2(n){return String(n).padStart(2,'0')}
function nowStr(){const d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes())}
function dateStr(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function todayStr(){return dateStr(new Date())}
function addDaysStr(n){const d=new Date();d.setDate(d.getDate()+n);return dateStr(d)}
function fmtN(n){const d=ST?.decimals==='2'?2:0;return'¥'+Number(Math.abs(n)).toFixed(d)}
function fmtRaw(n){const d=ST?.decimals==='2'?2:0;return Number(Math.abs(n)).toFixed(d)}
function autoType(t){return INCOME_KW.some(k=>t.includes(k))?'income':'expense'}
function autoCat(t,type){const cats=type==='income'?ICATS:type==='reimbursement'?RCATS:ECATS;for(const c of cats){const kws=CKWS[c.k]||[];if(kws.some(k=>t.includes(k)))return c.k;}return cats[0].k}
function getCatMeta(k,type){const cats=type==='income'?ICATS:type==='reimbursement'?RCATS:ECATS;return cats.find(c=>c.k===k)||cats[0]}
function daysLeft(dl){if(!dl)return null;return Math.ceil((new Date(dl)-new Date())/(86400000))}
function uniqueTs(base){let ts=base;while(RC.some(r=>r.ts===ts)||RM.some(r=>r.ts===ts))ts++;return ts}
function makeTs(date,time,offset=0){const clean=/^\d{1,2}:\d{1,2}$/.test(time||'')?time:nowStr();const n=new Date(date+'T'+clean+':00').getTime();return uniqueTs((Number.isFinite(n)?n:Date.now())+offset)}

function dateHint(t){
  if(/大前天/.test(t))return addDaysStr(-3);
  if(/前天/.test(t))return addDaysStr(-2);
  if(/昨天|昨日/.test(t))return addDaysStr(-1);
  if(/今天|今日/.test(t))return todayStr();
  const full=t.match(/(20\d{2})[年\-\/.](\\d{1,2})[月\-\/.](\\d{1,2})/);
  if(full)return`${full[1]}-${pad2(full[2])}-${pad2(full[3])}`;
  const md=t.match(/(\d{1,2})月(\d{1,2})[日号]?/)||t.match(/(?:^|\s)(\d{1,2})[\/.](\\d{1,2})(?=\s|$)/);
  if(md){const d=new Date();return`${d.getFullYear()}-${pad2(md[1])}-${pad2(md[2])}`;}
  return null;
}
function leadingDateHint(t){
  const s=t.trim();
  if(/^(大前天|前天|昨天|昨日|今天|今日)/.test(s))return dateHint(s);
  if(/^(20\d{2})[年\-\/.]/.test(s))return dateHint(s);
  if(/^\d{1,2}[月\/.]/.test(s))return dateHint(s);
  return null;
}
function timeHint(t){const m=t.match(/([01]?\d|2[0-3])[:：点](\d{1,2})?/);if(!m)return null;return pad2(m[1])+':'+pad2(m[2]||0)}
function splitQuickEntries(raw){
  const normalized=raw.replace(/[，,；;、|\/·\n]+/g,';').replace(/\s+/g,' ').trim();
  const parts=normalized.split(';').map(s=>s.trim()).filter(Boolean);
  const out=[];
  const re=/(.+?)([+\-＋－]?\d+(?:\.\d+)?)(?:\s*(?:元|块|rmb|RMB|cny|CNY|¥|￥))?(?=\s+[^0-9+\-＋－¥￥]*[+\-＋－]?\d|$)/g;
  parts.forEach(part=>{let m;re.lastIndex=0;while((m=re.exec(part))){const sa=m[2].replace('＋','+').replace('－','-');if(m[1].trim()&&parseFloat(sa)!==0)out.push({text:(m[1]+m[2]).trim(),amountText:sa});}});
  return out;
}
function splitReimbEntries(raw){
  const normalized=raw.replace(/[，,；;、|\/·\n]+/g,';').replace(/\s+/g,' ').trim();
  const parts=normalized.split(';').map(s=>s.trim()).filter(Boolean);
  const out=[];
  const re=/(.+?)([+\-＋－]?\d+(?:\.\d+)?)([^0-9+\-＋－]*?)(?=\s+[^0-9+\-＋－]*[+\-＋－]?\d|$)/g;
  parts.forEach(part=>{let m;re.lastIndex=0;while((m=re.exec(part))){const sa=m[2].replace('＋','+').replace('－','-');if(m[1].trim()&&parseFloat(sa)!==0)out.push({text:(m[1]+m[2]+(m[3]||'')).trim(),amountText:sa});}});
  return out;
}
function cleanQuickLabel(text,amountText){
  return text.replace(amountText,'').replace(/(20\d{2})[年\-\/.]\d{1,2}[月\-\/.]\d{1,2}[日号]?/g,'').replace(/\d{1,2}[月\/.]\d{1,2}[日号]?/g,'').replace(/大前天|前天|昨天|昨日|今天|今日/g,'').replace(/([01]?\d|2[0-3])[:：点]\d{0,2}/g,'').replace(/报销|支出|花了|收入|收到|收款|入账|到账|赚了/g,'').replace(/[元块￥¥+＋\-－]/g,'').replace(/\s+/g,' ').trim();
}
function quickKind(text,amountText){
  if(amountText.startsWith('+'))return 'income';
  if(amountText.startsWith('-'))return 'expense';
  if(/报销/.test(text)&&!/(报销收|报销到账|报销款|收到报销|报销已到|已报销)/.test(text))return 'reimbursement';
  return autoType(text);
}
function cellColor(net,budget){
  if(!net||Math.abs(net)<0.5)return{bg:'#f0f0f0',txt:'#1a1a1a'}
  if(net>0){const g=Math.min(1,net/(budget||50)/2);return{bg:`rgb(${Math.round(76+g*20)},${Math.round(175-g*50)},${Math.round(80+g*10)})`,txt:'#fff'}}
  const ratio=Math.abs(net)/(budget||50);
  if(ratio<0.3)return{bg:'#FFCDD2',txt:'#b71c1c'}
  if(ratio<0.7)return{bg:'#EF9A9A',txt:'#fff'}
  if(ratio<1.2)return{bg:'#e53935',txt:'#fff'}
  return{bg:'#B71C1C',txt:'#fff'}
}

let ST=null,RC=[],RM=[];
let qStep=0,qAns={};
let selDate=todayStr();
let detailView=null,detailSel=todayStr();
let modal=null,mType='expense',mCat='餐饮',mTs=null;
let reimbFilter='all';
let tmpR={hasInvoice:false,invoiceStatus:'未开',reimbursed:false,deadline:'',cat:'其他'};
let charts={};
let viewMonth=null;
function getViewMonth(){if(!viewMonth){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1);}return viewMonth;}
function prevMonth(mk){const[y,m]=mk.split('-').map(Number);return m===1?`${y-1}-12`:`${y}-${pad2(m-1)}`}
function nextMonth(mk){const[y,m]=mk.split('-').map(Number);return m===12?`${y+1}-01`:`${y}-${pad2(m+1)}`}
function isCurrentMonth(mk){const d=new Date();return mk===d.getFullYear()+'-'+pad2(d.getMonth()+1)}

const STEPS=[
  {id:'purpose',e:'👋',t:'你好！先聊两句~',s:'你用这个 app 主要想干嘛？',type:'choice',opts:[{k:'budget',t:'控制预算',s:'想知道钱花哪了，还剩多少'},{k:'record',t:'纯粹记录',s:'只想留个账，不被预算管'}]},
  {id:'budget',e:'💰',t:'每天预算是多少？',s:'比如每天 50 元，没花完会自动滚到明天',type:'amount',skip:a=>a.purpose==='record'},
  {id:'settleDay',e:'📅',t:'每月几号重新结算？',s:'填 1-31，比如工资日是 15 号，就填 15',type:'settle',skip:a=>a.purpose==='record'},
  {id:'carryover',e:'🎯',t:'结算日后结余怎么处理？',s:'到了结算日，上一周期剩下的钱是否继续保留',type:'choice',opts:[{k:'yes',t:'继承到下个周期',s:'省下来都是我的'},{k:'no',t:'清零重来',s:'每期全新开始'}],skip:a=>a.purpose==='record'},
  {id:'prevBalance',e:'↪',t:'有上周期剩余要带入吗？',s:'比如上个月还剩 21.7 元，可以加到本周期累计可用里',type:'prev',skip:a=>a.purpose==='record'||a.carryover!=='yes'},
  {id:'income_merge',e:'💼',t:'收入并入可用余额吗？',s:'兼职/工资赚的要算进去吗？',type:'choice',opts:[{k:'yes',t:'要，一起算',s:'赚多少用多少'},{k:'no',t:'分开记',s:'收入单独看'}],skip:a=>a.purpose==='record'},
  {id:'extra',e:'🎁',t:'有固定零花钱吗？',s:'比如每月家里给的',type:'extra',skip:a=>a.purpose==='record'},
  {id:'show_reimb',e:'🧾',t:'报销记录显示在流水里吗？',s:'报销卡片里一定会显示',type:'choice',opts:[{k:'yes',t:'显示',s:'和支出收入混在一起'},{k:'no',t:'不显示',s:'只在报销卡片里看'}]},
  {id:'decimals',e:'🔢',t:'金额显示精度？',s:'随时可以改',type:'choice',opts:[{k:'0',t:'整数',s:'¥50'},{k:'2',t:'两位小数',s:'¥50.00'}]},
];
function vis(){return STEPS.filter(s=>!(s.skip&&s.skip(qAns)))}

function showQuiz(){
  document.getElementById('app-screen').style.display='none';
  document.getElementById('detail-screen').style.display='none';
  const qs=document.getElementById('quiz-screen');
  qs.style.display='flex';qs.style.flexDirection='column';
  renderQuiz();
}
function renderQuiz(){
  const steps=vis();
  if(qStep>=steps.length){showSummary();return;}
  const step=steps[qStep];
  const dots=steps.map((_,i)=>`<div class="pdot${i<qStep?' done':i===qStep?' active':''}"></div>`).join('');
  let body='';
  if(step.type==='choice'){
    body=`<div class="qopts">${step.opts.map(o=>`<button class="qopt${qAns[step.id]===o.k?' sel':''}" onclick="pickQ('${step.id}','${o.k}')"><div class="qopt-t">${o.t}</div><div class="qopt-s">${o.s}</div></button>`).join('')}</div>`;
  }else if(step.type==='amount'){
    body=`<div class="qopts"><p style="font-size:11px;color:#aaa;margin-bottom:6px">每日预算金额</p><div class="amtbox"><span class="amtsym">¥</span><input class="amtin" id="aqv" type="number" inputmode="decimal" placeholder="50" min="0" step="1" value="${qAns.budget||''}"><span class="amtunit">元/天</span></div></div>`;
  }else if(step.type==='settle'){
    body=`<div class="qopts"><p style="font-size:11px;color:#aaa;margin-bottom:6px">每月几号作为新周期第一天</p><div class="amtbox"><input class="amtin" id="sdv" type="number" inputmode="numeric" placeholder="1" min="1" max="31" step="1" value="${qAns.settleDay||1}"><span class="amtunit">号重新开始</span></div></div>`;
  }else if(step.type==='prev'){
    const on=qAns.hasPrevBalance||false;
    body=`<div class="qopts"><div class="tog${on?' on':''}" onclick="togPrev()"><span class="tog-lbl">有，带入上周期剩余</span><div class="togpill${on?' on':''}"></div></div>${on?`<div class="amtbox"><span class="amtsym">¥</span><input class="amtin" id="pbv" type="number" inputmode="decimal" placeholder="21.7" min="0" step="0.01" value="${qAns.prevBalance||''}"><span class="amtunit">元</span></div>`:''}</div>`;
  }else if(step.type==='extra'){
    const on=qAns.hasExtra||false;
    body=`<div class="qopts"><div class="tog${on?' on':''}" onclick="togEx()"><span class="tog-lbl">有，每月固定零花钱</span><div class="togpill${on?' on':''}"></div></div>${on?`<div class="amtbox"><span class="amtsym">¥</span><input class="amtin" id="exv" type="number" inputmode="decimal" placeholder="0" min="0" step="1" value="${qAns.extraAmount||''}"><span class="amtunit">元/月</span></div>`:''}</div>`;
  }
  const canNext=step.type==='choice'?!!qAns[step.id]:true;
  document.getElementById('quiz-screen').innerHTML=`<div class="quiz-wrap"><div class="pdots">${dots}</div><p style="font-size:10px;color:#aaa;margin-bottom:5px">第${qStep+1}步/共${steps.length}步</p><span class="qemoji">${step.e}</span><div class="qtitle">${step.t}</div><div class="qsub">${step.s}</div>${body}<div class="navrow">${qStep>0?`<button class="btnback" onclick="qBack()">←</button>`:''}<button class="btnnext" onclick="qNext()" ${canNext?'':'disabled'}>${qStep===steps.length-1?'完成 ✓':'下一步 →'}</button></div></div>`;
}
function pickQ(id,k){qAns[id]=k;renderQuiz()}
function togEx(){qAns.hasExtra=!qAns.hasExtra;renderQuiz()}
function togPrev(){qAns.hasPrevBalance=!qAns.hasPrevBalance;renderQuiz()}
function qNext(){
  const steps=vis();const step=steps[qStep];
  if(step.type==='amount'){const v=parseFloat(document.getElementById('aqv')?.value);if(!v||v<=0)return;qAns.budget=v;}
  if(step.type==='settle'){const v=parseInt(document.getElementById('sdv')?.value||1,10);if(!v||v<1||v>31)return;qAns.settleDay=v;}
  if(step.type==='prev'&&qAns.hasPrevBalance){qAns.prevBalance=parseFloat(document.getElementById('pbv')?.value||0)||0;}
  if(step.type==='extra'&&qAns.hasExtra){qAns.extraAmount=parseFloat(document.getElementById('exv')?.value||0)||0;}
  if(qStep<steps.length-1){qStep++;renderQuiz();}else showSummary();
}
function qBack(){if(qStep>0){qStep--;renderQuiz()}}
function showSummary(){
  const a=qAns;
  const rows=a.purpose==='budget'?`<div class="sumrow"><span class="sumk">每日预算</span><span class="sumv">¥${a.budget}/天</span></div><div class="sumrow"><span class="sumk">结算日</span><span class="sumv">每月 ${a.settleDay||1} 号</span></div><div class="sumrow"><span class="sumk">结余继承</span><span class="sumv">${a.carryover==='yes'?'继承':'清零'}</span></div>${a.hasPrevBalance?`<div class="sumrow"><span class="sumk">上周期剩余</span><span class="sumv">¥${a.prevBalance}</span></div>`:''}<div class="sumrow"><span class="sumk">收入并入余额</span><span class="sumv">${a.income_merge==='yes'?'是':'否'}</span></div>${a.hasExtra?`<div class="sumrow"><span class="sumk">月零花钱</span><span class="sumv">¥${a.extraAmount}</span></div>`:''}<div class="sumrow"><span class="sumk">报销在流水</span><span class="sumv">${a.show_reimb==='yes'?'是':'否'}</span></div><div class="sumrow"><span class="sumk">金额精度</span><span class="sumv">${a.decimals==='2'?'两位小数':'整数'}</span></div>`:`<div class="sumrow"><span class="sumk">模式</span><span class="sumv">纯记录</span></div>`;
  document.getElementById('quiz-screen').innerHTML=`<div class="quiz-wrap"><div style="font-size:38px;text-align:center;margin-bottom:8px">🎉</div><div class="qtitle" style="text-align:center;margin-bottom:4px">设置好啦！</div><div class="qsub" style="text-align:center;margin-bottom:14px">随时右上角重新设置</div><div class="sumcard">${rows}</div><button class="finbtn" onclick="finishQ()">开始记账 →</button></div>`;
}
function finishQ(){
  const state=ld();state.settings=qAns;state.setupDone=true;
  if(!state.records)state.records=[];if(!state.reimbs)state.reimbs=[];
  sv(state);ST=qAns;RC=state.records;RM=state.reimbs;showApp();
}

function loadState(){const s=ld();ST=s.settings||{};RC=s.records||[];RM=s.reimbs||[]}
function saveState(){const s=ld();s.records=RC;s.reimbs=RM;sv(s)}
function fullState(){
  // 统一备份：包含记账日记 + 本月账单 + 财务总览
  const s=ld();
  let monthly={};let finance={};
  try{monthly=JSON.parse(localStorage.getItem('monthly_v1')||'{}')}catch(e){}
  try{finance=JSON.parse(localStorage.getItem('finance_v1')||'{}')}catch(e){}
  return{
    app:'财务管家',schema:3,exportedAt:new Date().toISOString(),
    diary:{settings:ST||s.settings||{},records:RC||s.records||[],reimbs:RM||s.reimbs||[]},
    monthly,finance
  };
}
function applyImportedState(raw){
  const data=raw?.data||raw;
  // 支持旧版格式（只有记账数据）和新版统一格式
  if(data?.diary){
    // 新版统一格式
    const d=data.diary;
    if(!d||(!Array.isArray(d.records)&&!Array.isArray(d.reimbs)))throw new Error('bad backup');
    const next=ld();next.setupDone=true;next.settings=d.settings||next.settings||ST||{};
    next.records=Array.isArray(d.records)?d.records:[];next.reimbs=Array.isArray(d.reimbs)?d.reimbs:[];
    sv(next);ST=next.settings;RC=next.records;RM=next.reimbs;
    // 恢复本月账单
    if(data.monthly&&Object.keys(data.monthly).length){
      localStorage.setItem('monthly_v1',JSON.stringify(data.monthly));
    }
    // 恢复财务总览
    if(data.finance&&Object.keys(data.finance).length){

function settleDay(){const v=parseInt(ST?.settleDay||1,10);return Math.min(31,Math.max(1,v||1))}
function settleDate(y,m,d){const dim=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(d,dim))}
function daysBetween(a,b){return Math.floor((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)+1}
function periodBounds(asOf=todayStr()){
  const d=new Date(asOf+'T00:00:00');const sd=settleDay();
  let start=settleDate(d.getFullYear(),d.getMonth(),sd);
  if(d<start)start=settleDate(d.getFullYear(),d.getMonth()-1,sd);

}
// 计算指定周期的结余（用于跨周期继承）
// ─── 预算历史（按周期隔离）───
// 格式：[{from:'2026-01-01', daily:50, extra:170}]
// from 是该设置生效的第一天（即某个周期的开始日）
function getBudgetHistory(){
  const s=ld();return s.budgetHistory||[];
}
function saveBudgetHistory(hist){
  const s=ld();s.budgetHistory=hist;sv(s);
}
// 获取某个周期开始日期对应的日预算和零花钱
function getSettingsForPeriod(periodStart){
  const hist=getBudgetHistory();
  // 找最近的一条 from <= periodStart
  const match=hist.filter(h=>h.from<=periodStart).sort((a,b)=>b.from.localeCompare(a.from))[0];
  if(match)return{daily:match.daily,extra:match.extra};
  // 没有历史记录，用当前设置
  return{daily:parseFloat(ST.budget)||50,extra:ST.hasExtra?(parseFloat(ST.extraAmount)||0):0};
}
// 修改预算时记录历史
function applyBudgetChange(daily,extra,fromDate){
  const hist=getBudgetHistory();
  // 如果同一天已有记录就覆盖
  const idx=hist.findIndex(h=>h.from===fromDate);
  if(idx>=0)hist[idx]={from:fromDate,daily,extra};
  else hist.push({from:fromDate,daily,extra});
  hist.sort((a,b)=>a.from.localeCompare(b.from));
  saveBudgetHistory(hist);
  // 同步更新当前ST
  ST.budget=daily;ST.hasExtra=extra>0;ST.extraAmount=extra;
  const s=ld();s.settings=ST;sv(s);
}

    const extra=ST.hasExtra?(parseFloat(ST.extraAmount)||0):0;

function calcPeriodBalance(periodStart,periodEnd){
  const{daily,extra}=getSettingsForPeriod(periodStart);
  const days=Math.max(1,daysBetween(periodStart,periodEnd));
  const recs=RC.filter(r=>r.date>=periodStart&&r.date<=periodEnd);
  const spent=recs.filter(r=>r.type==='expense').reduce((a,r)=>a+r.amount,0);
  const earned=recs.filter(r=>r.type==='income').reduce((a,r)=>a+r.amount,0);
  const accrued=daily*days;
  const income_add=ST.income_merge==='yes'?earned:0;
  return accrued+extra+income_add-spent;
}
// 自动计算跨周期继承的结余（递归追溯）
function autoCarryOver(currentPeriodStart){
  if(ST.carryover!=='yes')return ST.hasPrevBalance?(parseFloat(ST.prevBalance)||0):0;
  // 找上一个周期
  const d=new Date(currentPeriodStart+'T00:00:00');
  d.setDate(d.getDate()-1);// 上个周期的最后一天
  const prevPeriod=periodBounds(dateStr(d));
  // 上个周期有没有任何记录
  const prevRecs=RC.filter(r=>r.date>=prevPeriod.start&&r.date<=prevPeriod.end);
  if(!prevRecs.length){
    // 上个周期没有记录，用设置里的初始结余
    return ST.hasPrevBalance?(parseFloat(ST.prevBalance)||0):0;
  }
  // 上个周期的可用 = 上上期结余 + 累积预算 + 零花 + 收入 - 支出
  const prevCarry=autoCarryOver(prevPeriod.start);
  const prevBalance=calcPeriodBalanceWithCarry(prevPeriod.start,prevPeriod.end,prevCarry);
  return Math.max(0,prevBalance);// 超支不继承（负数按0处理）
}
function calcPeriodBalanceWithCarry(periodStart,periodEnd,carry){
  const{daily,extra}=getSettingsForPeriod(periodStart);
  const days=Math.max(1,daysBetween(periodStart,periodEnd));
  const recs=RC.filter(r=>r.date>=periodStart&&r.date<=periodEnd);
  const spent=recs.filter(r=>r.type==='expense').reduce((a,r)=>a+r.amount,0);
  const earned=recs.filter(r=>r.type==='income').reduce((a,r)=>a+r.amount,0);
  const accrued=daily*days;
  const income_add=ST.income_merge==='yes'?earned:0;
  return accrued+extra+income_add+carry-spent;
}
function budgetState(asOf=todayStr()){
  if(ST.purpose==='record')return null;
  const p=periodBounds(asOf);
  const{daily,extra}=getSettingsForPeriod(p.start);
  // 自动计算上期继承结余
  const previous=autoCarryOver(p.start);
  const start=p.start;
  const recs=RC.filter(r=>r.date>=start&&r.date<=asOf);
  const todayRecs=RC.filter(r=>r.date===asOf);
  const spent=recs.filter(r=>r.type==='expense').reduce((a,r)=>a+r.amount,0);
  const earned=recs.filter(r=>r.type==='income').reduce((a,r)=>a+r.amount,0);
  const todaySpent=todayRecs.filter(r=>r.type==='expense').reduce((a,r)=>a+r.amount,0);
  const days=Math.max(1,daysBetween(start,asOf));
  const accrued=daily*days;const added=previous+extra+(ST.income_merge==='yes'?earned:0);
  const balance=accrued+added-spent;const dailyRemaining=daily-todaySpent;
  const periodDays=Math.max(1,daysBetween(p.start,p.end));
  const daysRemain=Math.max(0,daysBetween(asOf,p.end)-1);
  return{periodStart:p.start,periodEnd:p.end,settleDay:p.settleDay,calcStart:start,daily,extra,previous,spent,earned,todaySpent,dailyRemaining,days,accrued,added,balance,periodDays,daysRemain,periodTotal:daily*periodDays};
}

function getMonthStats(mk){
  // 支持传入指定月份，默认当月
  if(!mk){const now=new Date();mk=now.getFullYear()+'-'+pad2(now.getMonth()+1);}
  const[yr,mo]=mk.split('-').map(Number);

  const isThisMonth=isCurrentMonth(mk);
  const todayDay=isThisMonth?new Date().getDate():daysInM;
  const totalSpent=monthRecs.reduce((a,r)=>a+r.amount,0);
  const totalIncome=RC.filter(r=>r.date&&r.date.startsWith(mk)&&r.type==='income').reduce((a,r)=>a+r.amount,0);
  const dayAvg=todayDay>0?(totalSpent/todayDay):0;
  const dayMap={};monthRecs.forEach(r=>{dayMap[r.date]=(dayMap[r.date]||0)+r.amount});
  const maxDay=Object.entries(dayMap).sort((a,b)=>b[1]-a[1])[0];
  return{totalSpent,totalIncome,dayAvg,maxDay,todayDay,daysInMonth:daysInM,mk};
}

// 上周同期对比
function getWeekCompare(){
  const now=new Date();
  let thisStart=new Date(now);thisStart.setDate(now.getDate()-now.getDay());
  let lastStart=new Date(thisStart);lastStart.setDate(thisStart.getDate()-7);
  let lastEnd=new Date(thisStart);lastEnd.setDate(thisStart.getDate()-1);
  const thisWk=RC.filter(r=>r.type==='expense'&&r.date>=dateStr(thisStart)&&r.date<=dateStr(now)).reduce((a,r)=>a+r.amount,0);
  const lastWk=RC.filter(r=>r.type==='expense'&&r.date>=dateStr(lastStart)&&r.date<=dateStr(lastEnd)).reduce((a,r)=>a+r.amount,0);
  return{thisWk,lastWk,diff:thisWk-lastWk,pct:lastWk>0?((thisWk-lastWk)/lastWk*100):0};
}

function getCatStats(mk){
  if(!mk){const now=new Date();mk=now.getFullYear()+'-'+pad2(now.getMonth()+1);}
  const[yr,mo]=mk.split('-').map(Number);
  const daysInM=new Date(yr,mo,0).getDate();
  const isThisMonth=isCurrentMonth(mk);
  const todayDay=isThisMonth?new Date().getDate():daysInM;
  const catMap={};
  RC.filter(r=>r.date&&r.date.startsWith(mk)&&r.type==='expense').forEach(r=>{
    if(!catMap[r.cat])catMap[r.cat]={total:0,count:0,max:0};

    cat,total:v.total,count:v.count,max:v.max,

  })).sort((a,b)=>b.total-a.total);
}

function switchMonth(dir){
  const cur=getViewMonth();
  if(dir==='prev'){
    // 检查是否有更早记录
    const pm=prevMonth(cur);
    const hasPrev=RC.some(r=>r.date&&r.date.startsWith(pm))||RM.some(r=>r.date&&r.date.startsWith(pm));
    const hasAnyPrev=RC.some(r=>r.date&&r.date<cur)||RM.some(r=>r.date&&r.date<cur);
    if(!hasAnyPrev)return;
    viewMonth=pm;
  }else{
    if(isCurrentMonth(cur))return;
    const nm=nextMonth(cur);
    viewMonth=isCurrentMonth(nm)?null:nm;
  }
  // 切换月份时重置选中日期为该月第一天
  const[y,m]=getViewMonth().split('-').map(Number);
  if(isCurrentMonth(getViewMonth())){selDate=todayStr();}
  else{selDate=`${y}-${String(m).padStart(2,'0')}-01`;}
  detailSel=selDate;
  showApp();
}
function selDay(ds){selDate=ds;showApp()}
function openDetail(view){
  destroyCharts();detailView=view;
  // 进入日历详情，保持当前选中日期；如果选中日期不在 viewMonth，重置为 viewMonth 第一天
  const vm=getViewMonth();
  if(view==='cal'&&(!detailSel||!detailSel.startsWith(vm))){
    if(isCurrentMonth(vm))detailSel=todayStr();
    else{const[y,m]=vm.split('-').map(Number);detailSel=`${y}-${String(m).padStart(2,'0')}-01`;}
  }
  // 进入报销时自动选最有意义的tab
  if(view==='reimb')openReimbDetail();
  document.getElementById('app-screen').style.display='none';
  const ds=document.getElementById('detail-screen');ds.style.display='flex';ds.style.flexDirection='column';
  renderDetail();
}

    <input id="backup-file" type="file" accept="application/json,.json" style="display:none" onchange="importDataFile(this)">
    <div class="sumcard">
      <div class="sumrow"><span class="sumk">最后备份</span><span class="sumv">${c.lastBackup?c.lastBackup.slice(0,10):'未备份'}</span></div>
      <div class="sumrow"><span class="sumk">记账流水</span><span class="sumv">${c.records} 条</span></div>
      <div class="sumrow"><span class="sumk">报销记录</span><span class="sumv">${c.reimbs} 条</span></div>
      <div class="sumrow"><span class="sumk">财务总览</span><span class="sumv">${c.financeCount} 个投资项目</span></div>
      <div class="sumrow"><span class="sumk">本月账单</span><span class="sumv">${c.monthlyCount?'有数据':'无数据'}</span></div>
    </div>
  </div>`;
  document.getElementById('shell').appendChild(ov);
}
function renderAddModal(){
  const ov=mkOverlay();
  ov.innerHTML=`<div class="modal-sheet"><div class="mhandle"></div><div class="mtitle">新增记录</div><div class="mtype-row">${mTypeBtns()}</div><div class="mcats" id="mc">${mCatsHtml()}</div><div class="mfields"><div class="mfield"><span class="mflbl">备注</span><input id="mn" inputmode="text" placeholder="发生了什么..."></div><div class="mfield"><span class="mflbl">¥ 金额</span><input id="ma" type="number" inputmode="decimal" placeholder="0.00" min="0" step="0.01"></div><div class="mfield"><span class="mflbl">日期</span><input id="md" type="date" value="${currentEntryDate()}"></div><div class="mfield"><span class="mflbl">时间</span><input id="mt" type="time" value="${nowStr()}"></div></div><button class="msub" onclick="submitAdd()">记录</button></div>`;
  document.getElementById('shell').appendChild(ov);
}
function renderEditModal(){
  const r=RC.find(r=>r.ts===mTs);if(!r)return;
  const ov=mkOverlay();
  ov.innerHTML=`<div class="modal-sheet"><div class="mhandle"></div><div class="mtitle">编辑记录</div><div class="mtype-row">${mTypeBtns()}</div><div class="mcats" id="mc">${mCatsHtml()}</div><div class="mfields"><div class="mfield"><span class="mflbl">备注</span><input id="mn" value="${r.label}"></div><div class="mfield"><span class="mflbl">¥ 金额</span><input id="ma" type="number" inputmode="decimal" min="0" step="0.01" value="${r.amount}"></div><div class="mfield"><span class="mflbl">日期</span><input id="md" type="date" value="${r.date||selDate}"></div><div class="mfield"><span class="mflbl">时间</span><input id="mt" type="time" value="${normalizeTime(r.time||nowStr())}"></div></div><button class="msub" onclick="submitEdit()">保存修改</button><button class="mdel" onclick="delRec(${r.ts})">删除这条记录</button></div>`;
  document.getElementById('shell').appendChild(ov);
}
function invOpts(cur){return['未开','已开','已拿到'].map(s=>`<div class="mreimb-opt${cur===s?' sel':''}" onclick="setInvSt('${s}')">${s}</div>`).join('')}
function renderReimbAddModal(){
  const ov=mkOverlay();
  ov.innerHTML=`<div class="modal-sheet"><div class="mhandle"></div><div class="mtitle">新增报销</div><div class="mcats" id="mc-r">${RCATS.map(c=>`<div class="mcat${tmpR.cat===c.k?' sel':''}" onclick="setRC('${c.k}')">${c.i} ${c.k}</div>`).join('')}</div><div class="mfields"><div class="mfield"><span class="mflbl">名称</span><input id="rn" inputmode="text" placeholder="报销事由..."></div><div class="mfield"><span class="mflbl">¥ 金额</span><input id="ra" type="number" inputmode="decimal" placeholder="0.00" min="0" step="0.01"></div><div class="mfield"><span class="mflbl">日期</span><input id="rdate" type="date" value="${currentEntryDate()}"></div><div class="mfield"><span class="mflbl">截止日</span><input id="rd" type="date" value="${tmpR.deadline}"></div></div><div class="mreimb-sec"><div class="mreimb-sec-title">发票状态</div><div class="mreimb-row"><span class="mreimb-lbl">有发票</span><div class="mreimb-opts"><div class="mreimb-opt${!tmpR.hasInvoice?' sel':''}" onclick="setHasInv(false)">没有</div><div class="mreimb-opt${tmpR.hasInvoice?' sel':''}" onclick="setHasInv(true)">有</div></div></div><div class="mreimb-row" id="inv-row" style="${tmpR.hasInvoice?'':'display:none'}"><span class="mreimb-lbl">开票进度</span><div class="mreimb-opts" id="inv-opts">${invOpts(tmpR.invoiceStatus)}</div></div></div><button class="msub" onclick="submitReimbAdd()">记录报销</button></div>`;
  document.getElementById('shell').appendChild(ov);
}
function renderReimbEditModal(){
  const r=RM.find(r=>r.ts===mTs);if(!r)return;
  const ov=mkOverlay();
  ov.innerHTML=`<div class="modal-sheet"><div class="mhandle"></div><div class="mtitle">编辑报销</div><div class="mcats" id="mc-r">${RCATS.map(c=>`<div class="mcat${tmpR.cat===c.k?' sel':''}" onclick="setRC('${c.k}')">${c.i} ${c.k}</div>`).join('')}</div><div class="mfields"><div class="mfield"><span class="mflbl">名称</span><input id="rn" value="${r.name}"></div><div class="mfield"><span class="mflbl">¥ 金额</span><input id="ra" type="number" inputmode="decimal" min="0" step="0.01" value="${r.amount}"></div><div class="mfield"><span class="mflbl">日期</span><input id="rdate" type="date" value="${r.date||selDate}"></div><div class="mfield"><span class="mflbl">截止日</span><input id="rd" type="date" value="${r.deadline||''}"></div></div><div class="mreimb-sec"><div class="mreimb-sec-title">发票状态</div><div class="mreimb-row"><span class="mreimb-lbl">有发票</span><div class="mreimb-opts"><div class="mreimb-opt${!tmpR.hasInvoice?' sel':''}" onclick="setHasInv(false)">没有</div><div class="mreimb-opt${tmpR.hasInvoice?' sel':''}" onclick="setHasInv(true)">有</div></div></div><div class="mreimb-row" id="inv-row" style="${tmpR.hasInvoice?'':'display:none'}"><span class="mreimb-lbl">开票进度</span><div class="mreimb-opts" id="inv-opts">${invOpts(tmpR.invoiceStatus)}</div></div></div><button class="mark-reimb-btn${r.reimbursed?' done':''}" onclick="toggleReimbDone(${r.ts})">${r.reimbursed?'✓ 已报销（点击撤销）':'标记为已报销'}</button><button class="msub" onclick="submitReimbEdit()">保存修改</button><button class="mdel" onclick="delReimb(${r.ts})">删除</button></div>`;
  document.getElementById('shell').appendChild(ov);
}
function setMType(t){mType=t;mCat=(t==='income'?ICATS:ECATS)[0].k;document.getElementById('mc').innerHTML=mCatsHtml();document.querySelectorAll('.mtbtn').forEach((b,i)=>{b.className='mtbtn'+(i===0&&t==='expense'?' so':i===1&&t==='income'?' si':'')})}
function setMCat(k){mCat=k;document.getElementById('mc')?.querySelectorAll('.mcat').forEach(el=>el.classList.toggle('sel',el.textContent.trim().includes(k)))}
function setRC(k){tmpR.cat=k;document.getElementById('mc-r')?.querySelectorAll('.mcat').forEach(el=>el.classList.toggle('sel',el.textContent.trim().includes(k)))}
function setHasInv(v){tmpR.hasInvoice=v;document.querySelectorAll('.mreimb-opt').forEach(el=>{if(el.textContent==='没有')el.classList.toggle('sel',!v);if(el.textContent==='有')el.classList.toggle('sel',v)});const row=document.getElementById('inv-row');if(row)row.style.display=v?'':'none'}
function setInvSt(s){tmpR.invoiceStatus=s;document.getElementById('inv-opts')?.querySelectorAll('.mreimb-opt').forEach(el=>el.classList.toggle('sel',el.textContent===s))}
function submitAdd(){
  const note=document.getElementById('mn')?.value.trim()||'记录';const amt=parseFloat(document.getElementById('ma')?.value);
  const date=document.getElementById('md')?.value||currentEntryDate();const time=normalizeTime(document.getElementById('mt')?.value||nowStr());
  if(!amt||amt<=0){showToast('请输入有效金额');return;}
  RC.push({type:mType,amount:amt,label:note,cat:mCat,date,time,ts:makeTs(date,time)});
  selDate=date;detailSel=date;saveState();modal=null;detailView?renderDetail():showApp();
}
function submitEdit(){
  const note=document.getElementById('mn')?.value.trim()||'记录';const amt=parseFloat(document.getElementById('ma')?.value);
  const date=document.getElementById('md')?.value||selDate;const time=normalizeTime(document.getElementById('mt')?.value||nowStr());
  if(!amt||amt<=0){showToast('请输入有效金额');return;}
  const idx=RC.findIndex(r=>r.ts===mTs);
  if(idx>=0)RC[idx]={...RC[idx],type:mType,amount:amt,label:note,cat:mCat,date,time,ts:makeTs(date,time)};
  selDate=date;detailSel=date;saveState();modal=null;detailView?renderDetail():showApp();
}
function delRec(ts){RC=RC.filter(r=>r.ts!==ts);saveState();modal=null;detailView?renderDetail():showApp()}
function submitReimbAdd(){
  const name=document.getElementById('rn')?.value.trim()||'报销';const amt=parseFloat(document.getElementById('ra')?.value);
  const date=document.getElementById('rdate')?.value||currentEntryDate();const deadline=document.getElementById('rd')?.value||'';const time=nowStr();
  if(!amt||amt<=0){showToast('请输入有效金额');return;}
  RM.push({name,amount:amt,date,time,ts:makeTs(date,time),hasInvoice:tmpR.hasInvoice,invoiceStatus:tmpR.invoiceStatus,reimbursed:false,deadline,cat:tmpR.cat});
  selDate=date;detailSel=date;saveState();modal=null;detailView?renderDetail():showApp();
}
function submitReimbEdit(){
  const name=document.getElementById('rn')?.value.trim()||'报销';const amt=parseFloat(document.getElementById('ra')?.value);
  const date=document.getElementById('rdate')?.value||selDate;const deadline=document.getElementById('rd')?.value||'';
  if(!amt||amt<=0){showToast('请输入有效金额');return;}
  const idx=RM.findIndex(r=>r.ts===mTs);
  if(idx>=0)Object.assign(RM[idx],{name,amount:amt,date,deadline,hasInvoice:tmpR.hasInvoice,invoiceStatus:tmpR.invoiceStatus,cat:tmpR.cat,ts:makeTs(date,RM[idx].time||nowStr())});
  selDate=date;detailSel=date;saveState();modal=null;detailView?renderDetail():showApp();
}
function delReimb(ts){RM=RM.filter(r=>r.ts!==ts);saveState();modal=null;detailView?renderDetail():showApp()}
function toggleReimbDone(ts){const idx=RM.findIndex(r=>r.ts===ts);if(idx>=0)RM[idx].reimbursed=!RM[idx].reimbursed;saveState();modal=null;detailView?renderDetail():showApp()}

function quickAddReimb(inputId='ri-detail'){
  const inp=document.getElementById(inputId);const raw=inp?.value.trim();if(!raw)return;
  const entries=splitReimbEntries(raw);if(!entries.length){openReimbAdd();return;}
  const globalDate=leadingDateHint(raw)||currentEntryDate();const baseNow=nowStr();let added=0,lastDate=globalDate;
  entries.forEach((e,i)=>{
    const amount=Math.abs(parseFloat(e.amountText));if(!amount)return;
    const date=dateHint(e.text)||globalDate;const time=normalizeTime(timeHint(e.text)||baseNow);
    const inv=invoiceInfo(e.text);const label=cleanReimbLabel(e.text,e.amountText)||'报销';
    const cat=autoCat(label,'reimbursement');
    RM.push({name:label,amount,date,time,ts:makeTs(date,time,i),hasInvoice:inv.hasInvoice,invoiceStatus:inv.invoiceStatus,reimbursed:inv.reimbursed,deadline:'',cat});
    added++;lastDate=date;
  });
  if(!added){showToast('没有识别到有效金额');return;}
  selDate=lastDate;detailSel=lastDate;saveState();inp.value='';renderDetail();
}
function quickAdd(inputId='qi-app'){
  const inp=document.getElementById(inputId);const raw=inp?.value.trim();if(!raw)return;
  const entries=raw.includes('报销')?splitReimbEntries(raw):splitQuickEntries(raw);
  if(!entries.length){openAdd();return;}
  const globalDate=leadingDateHint(raw)||currentEntryDate();const baseNow=nowStr();let added=0,lastDate=globalDate;
  entries.forEach((e,i)=>{
    const amount=Math.abs(parseFloat(e.amountText));if(!amount)return;
    const kind=quickKind(e.text,e.amountText);
    const date=dateHint(e.text)||globalDate;const time=normalizeTime(timeHint(e.text)||baseNow);
    if(kind==='reimbursement'){
      const inv=invoiceInfo(e.text);const label=cleanReimbLabel(e.text,e.amountText)||'报销';
      const cat=autoCat(label,'reimbursement');
      RM.push({name:label,amount,date,time,ts:makeTs(date,time,i),hasInvoice:inv.hasInvoice,invoiceStatus:inv.invoiceStatus,reimbursed:inv.reimbursed,deadline:'',cat});
    }else{
      const label=cleanQuickLabel(e.text,e.amountText)||'记录';const type=kind;const cat=autoCat(label,type);
      RC.push({type,amount,label,cat,date,time,ts:makeTs(date,time,i)});
    }
    added++;lastDate=date;
  });
  if(!added){showToast('没有识别到有效金额');return;}
  selDate=lastDate;detailSel=lastDate;saveState();inp.value='';
  const hint=document.getElementById(inputId+'-hint');if(hint){hint.textContent='';hint.className='input-hint';}
  detailView?renderDetail():showApp();
}

const s=ld();
// 直接进app，不再做问卷
if(s.setupDone||true){
  ST=s.settings||{purpose:'budget',budget:50,settleDay:1,carryover:'yes',income_merge:'yes',hasExtra:true,extraAmount:170,show_reimb:'no',decimals:'2'};
  RC=s.records||[];RM=s.reimbs||[];
  // 首次进入自动写入默认设置
  if(!s.setupDone){const ns=ld();ns.setupDone=true;ns.settings=ST;ns.records=[];ns.reimbs=[];sv(ns);}
  showApp();
}
</script>
</body>
