<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>财务总览 - 财务管家</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:#0f1117;color:#e8eaf0}
.shell{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;background:#0f1117;position:sticky;top:0;z-index:10;border-bottom:1px solid #1a2030}
.topbar-left{display:flex;align-items:center;gap:10px}
.back-home{font-size:20px;color:#556;text-decoration:none}
.topbar-title{font-size:16px;font-weight:700}
.topbar-right{display:flex;gap:8px}
.tbtn{font-size:11px;color:#378ADD;background:none;border:1px solid #1e3a5f;border-radius:8px;padding:4px 10px;cursor:pointer}
.tbtn.green{color:#4caf50;border-color:#1e3a1e}
.scroll-body{flex:1;padding:12px 12px 32px;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* 英雄卡 */
.hero{background:linear-gradient(135deg,#1a2744,#0f1a2e);border:1px solid #1e3a5f;border-radius:18px;padding:18px;margin-bottom:10px}
.hero-lbl{font-size:11px;color:#445;letter-spacing:.06em;margin-bottom:5px}
.hero-amt{font-size:30px;font-weight:700;letter-spacing:-.5px;margin-bottom:12px}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.hg{background:rgba(255,255,255,.04);border-radius:10px;padding:8px;text-align:center}
.hg-l{font-size:10px;color:#445;margin-bottom:3px}
.hg-v{font-size:13px;font-weight:600}
.hg-v.pos{color:#4caf50}.hg-v.neg{color:#ef5350}.hg-v.neu{color:#e8eaf0}.hg-v.warn{color:#ff9800}
.overall-bar{height:5px;background:#1e2a3a;border-radius:3px;overflow:hidden}
.overall-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#378ADD,#4caf50);transition:width .6s}
.overall-lbl{display:flex;justify-content:space-between;font-size:10px;color:#445;margin-top:5px}
/* 分组 */
.group-hdr{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px;margin-top:8px}
.group-title{font-size:12px;font-weight:700;color:#556;letter-spacing:.05em}
.group-sub{font-size:11px;color:#445}
/* 投资卡 */
.inv-card{background:#161b26;border:1px solid #1e2a3a;border-radius:14px;padding:14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;-webkit-tap-highlight-color:transparent}
.inv-card:active{border-color:#378ADD}
.inv-card.completed{border-color:#2e5e2e;background:#131a13}
.ic-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.ic-left{flex:1;min-width:0}
.ic-name{font-size:14px;font-weight:600;color:#e8eaf0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ic-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
.ic-badge.done{background:#1e3a1e;color:#4caf50}
.ic-badge.active{background:#1e3a5f;color:#378ADD}
.ic-badge.saving{background:#2a2010;color:#ff9800}
.ic-badge.stock{background:#2a1a2a;color:#ce93d8}
.ic-meta{font-size:11px;color:#445;margin-top:3px}
.ic-right{text-align:right;flex-shrink:0;margin-left:10px}
.ic-remain{font-size:15px;font-weight:700}
.ic-remain.done{color:#4caf50}
.ic-sub{font-size:10px;color:#445;margin-top:2px}
.ic-bar-bg{height:5px;background:#1e2a3a;border-radius:3px;overflow:hidden;margin-bottom:8px}
.ic-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.ic-stats{display:flex}
.ic-stat{flex:1;text-align:center;border-right:1px solid #1e2a3a}
.ic-stat:last-child{border-right:none}
.ic-sl{font-size:10px;color:#445;margin-bottom:2px}
.ic-sv{font-size:12px;font-weight:600;color:#e8eaf0}
.ic-sv.pos{color:#4caf50}.ic-sv.neg{color:#ef5350}
/* 股票卡 */
.stock-card{background:#161b26;border:1px solid #1e2a3a;border-radius:14px;padding:14px;margin-bottom:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stock-card:active{border-color:#ce93d8}
.sc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.sc-name{font-size:14px;font-weight:700;color:#e8eaf0}
.sc-meta{font-size:11px;color:#445;margin-top:3px}
.sc-right{text-align:right}
.sc-cost{font-size:13px;font-weight:600;color:#e8eaf0}
.sc-pnl{font-size:11px;margin-top:2px}
.sc-pnl.pos{color:#4caf50}.sc-pnl.neg{color:#ef5350}.sc-pnl.neu{color:#556}
/* 止盈止损线 */
.sl-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.sl-item{background:#0f1117;border-radius:10px;padding:8px 10px;border:1px solid #1e2a3a}
.sl-item.tp{border-color:#1e3a1e}
.sl-item.sl{border-color:#3a1a1a}
.sl-label{font-size:10px;color:#556;margin-bottom:3px}
.sl-price{font-size:14px;font-weight:700}
.sl-price.tp{color:#4caf50}
.sl-price.sl{color:#ef5350}
.sl-pct{font-size:10px;margin-top:1px}
.sl-pct.tp{color:#2e7d32}.sl-pct.sl{color:#c62828}
/* 止盈计划列表 */
.tp-plan-list{margin-bottom:10px}
.tp-plan-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #1e2a3a}
.tp-plan-item:last-child{border-bottom:none}
.tp-tag{font-size:10px;padding:2px 7px;border-radius:6px;background:#1e3a1e;color:#4caf50;flex-shrink:0}
.tp-tag.done{background:#1a2030;color:#556;text-decoration:line-through}
.tp-info{flex:1;font-size:12px;color:#778}
.tp-profit{font-size:12px;font-weight:600;color:#4caf50;flex-shrink:0}
.tp-profit.done{color:#556}
/* 买入记录 */
.buy-list{margin-bottom:8px}
.buy-item{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;border-bottom:1px solid #1e2a3a;font-size:12px;color:#778}
.buy-item:last-child{border-bottom:none}
.buy-date{color:#445;min-width:72px}
.buy-qty{color:#e8eaf0;font-weight:600;min-width:52px}
.buy-price{color:#e8eaf0}
.buy-total{color:#4caf50}
/* 账户资金卡 */
.account-card{background:#1a2030;border:1px solid #1e3a5f;border-radius:14px;padding:14px;margin-bottom:8px}
.ac-title{font-size:12px;font-weight:700;color:#556;letter-spacing:.05em;margin-bottom:10px}
.ac-main{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ac-avail{font-size:24px;font-weight:700;color:#e8eaf0}
.ac-avail-lbl{font-size:11px;color:#445;margin-bottom:4px}
.ac-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ac-stat{background:#0f1117;border-radius:8px;padding:8px;text-align:center}
.ac-sl{font-size:10px;color:#445;margin-bottom:3px}
.ac-sv{font-size:13px;font-weight:600}
/* 模态框 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;justify-content:flex-end;z-index:100}
.modal-sheet{background:#1a1f2e;border-radius:20px 20px 0 0;padding:18px 16px 32px;max-height:92%;overflow-y:auto}
.mhandle{width:32px;height:4px;border-radius:2px;background:#2a3040;margin:0 auto 14px}
.mtitle{font-size:15px;font-weight:700;color:#e8eaf0;margin-bottom:4px}
.msub-title{font-size:12px;color:#445;margin-bottom:14px}
.msec{font-size:11px;font-weight:600;color:#445;letter-spacing:.04em;margin:14px 0 8px;padding-top:8px;border-top:1px solid #1e2a3a}
.msec:first-of-type{border-top:none;padding-top:0}
.mfields{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.mfield{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0f1117;border-radius:10px;border:1px solid #1e2a3a}
.mflbl{font-size:11px;color:#445;width:60px;flex-shrink:0}
.mfield input,.mfield select{flex:1;background:none;border:none;outline:none;font-size:13px;color:#e8eaf0;font-family:inherit;min-width:0}
.mfield select option{background:#1a1f2e}
.mfield-note{font-size:11px;color:#445;padding:0 4px;flex-shrink:0}
.msub{width:100%;height:44px;border-radius:12px;border:none;background:#378ADD;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;-webkit-tap-highlight-color:transparent}
.msub.green{background:#2e7d32}
.msub.orange{background:#e65100}
.msub.gray{background:#1e2a3a;color:#778}
.mdel{width:100%;height:38px;border-radius:10px;border:1px solid #3a1a1a;background:transparent;color:#ef5350;font-size:13px;cursor:pointer}
.minfo{font-size:11px;color:#778;background:#0f1117;border-radius:8px;padding:8px 12px;margin-bottom:10px;line-height:1.7}
.calc-box{background:#0f1117;border-radius:10px;padding:10px 12px;margin-bottom:10px;border:1px solid #1e3a1e}
.calc-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.calc-lbl{color:#445}
.calc-val{color:#4caf50;font-weight:600}
.calc-val.neg{color:#ef5350}
.tp-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.tp-row-item{background:#0f1117;border-radius:10px;padding:10px;border:1px solid #1e2a3a;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tp-row-label{font-size:11px;color:#556;width:100%}
.tp-row-fields{display:flex;gap:6px;align-items:center;width:100%}
.tp-row-input{flex:1;background:#1e2a3a;border:1px solid #2a3a4a;border-radius:8px;padding:7px 10px;font-size:13px;color:#e8eaf0;outline:none;min-width:0}
.tp-row-del{background:none;border:none;color:#445;cursor:pointer;font-size:16px;padding:0 4px;flex-shrink:0}
.add-tp-btn{width:100%;height:36px;border-radius:10px;border:1px dashed #1e3a5f;background:transparent;color:#378ADD;font-size:12px;cursor:pointer;margin-bottom:10px}
.data-btns{display:flex;flex-direction:column;gap:8px}
.data-btn{width:100%;height:44px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;border:none}
.data-btn.export{background:#1e3a5f;color:#378ADD}
.data-btn.import{background:#1e2a1e;color:#4caf50}
.data-btn.danger{background:#3a1a1a;color:#ef5350}
.empty-hint{text-align:center;color:#334;font-size:12px;padding:20px 0}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="topbar-left">
      <a class="back-home" href="../">←</a>
      <span class="topbar-title">财务总览</span>
    </div>
    <div class="topbar-right">
      <button class="tbtn green" onclick="openData()">备份</button>
      <button class="tbtn" onclick="openAddInv()">+ 添加</button>
    </div>
  </div>
  <div class="scroll-body"><div id="main-content"></div></div>
</div>

<script>
const SK='finance_v1';
const COLORS=['#378ADD','#4caf50','#FFD700','#ef5350','#9c27b0','#ff9800','#00bcd4'];
const GROUP_INFO={
  fund:{label:'基金定投',icon:'📈',badgeClass:'active'},
  gold:{label:'黄金积存金',icon:'🥇',badgeClass:'active'},
  saving:{label:'储蓄目标',icon:'🎯',badgeClass:'saving'},
  stock:{label:'股票账户',icon:'📊',badgeClass:'stock'},
};

// ── 默认数据 ──
const DEFAULT_ITEMS=[];// 无默认数据，用户自行添加

// 股票账户默认数据（空）
const DEFAULT_STOCK_ACCOUNT={
  initialCapital:10000,
  deposits:[],
  stocks:[],
};

function ld(){try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){return{}}}
function sv(d){localStorage.setItem(SK,JSON.stringify(d))}
function fmt2(n){return Number(Math.abs(n)).toFixed(2)}
function fmtY(n,dec=2){return'¥'+fmt2(n)}
function fmtPct(n){return(n>=0?'+':'')+Number(n).toFixed(1)+'%'}
function pad2(n){return String(n).padStart(2,'0')}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function genId(){return'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}

let ITEMS=[],STOCK_ACCOUNT={},modal=null,editId=null,editSub=null;

function loadData(){
  const s=ld();
  ITEMS=s.items||JSON.parse(JSON.stringify(DEFAULT_ITEMS));
  STOCK_ACCOUNT=s.stockAccount||JSON.parse(JSON.stringify(DEFAULT_STOCK_ACCOUNT));
}
function saveData(){
  const s=ld();s.items=ITEMS;s.stockAccount=STOCK_ACCOUNT;sv(s);
}

// ── 股票计算 ──
function calcStock(st){
  const totalBought=st.buyRecords.reduce((s,r)=>s+r.qty,0);
  const totalSold=st.sellRecords.reduce((s,r)=>s+r.qty,0);
  const holdQty=totalBought-totalSold;
  const totalCost=st.buyRecords.reduce((s,r)=>s+r.amount,0);
  const totalSoldAmt=st.sellRecords.reduce((s,r)=>s+r.amount,0);
  const totalProfit=st.sellRecords.reduce((s,r)=>s+r.profit,0);
  // 当前持仓成本（按比例）
  const avgCost=totalBought>0?totalCost/totalBought:0;
  const holdCost=avgCost*holdQty;
  // 止盈止损价格
  const tpPrice=avgCost>0?avgCost*(1+(st.tpPct||20)/100):0;
  const slPrice=avgCost>0?avgCost*(1+(st.slPct||-15)/100):0;
  return{holdQty,totalBought,totalSold,totalCost,totalSoldAmt,totalProfit,avgCost,holdCost,tpPrice,slPrice};
}

// ── 账户资金 ──
function calcAccount(){
  const initial=STOCK_ACCOUNT.initialCapital||10000;
  const deposited=STOCK_ACCOUNT.deposits.reduce((s,d)=>s+d.amount,0);
  const totalIn=initial+deposited;
  // 买入总花费
  const totalBought=STOCK_ACCOUNT.stocks.reduce((s,st)=>s+st.buyRecords.reduce((a,r)=>a+r.amount,0),0);
  // 卖出总收回
  const totalSold=STOCK_ACCOUNT.stocks.reduce((s,st)=>s+st.sellRecords.reduce((a,r)=>a+r.amount,0),0);
  // 总利润
  const totalProfit=STOCK_ACCOUNT.stocks.reduce((s,st)=>s+st.sellRecords.reduce((a,r)=>a+r.profit,0),0);
  // 当前持仓成本（还在场内的钱）
  const holdCost=STOCK_ACCOUNT.stocks.reduce((s,st)=>{const c=calcStock(st);return s+c.holdCost},0);
  // 可用资金 = 总投入 - 总买入 + 总卖出
  const available=totalIn-totalBought+totalSold;
  return{initial,deposited,totalIn,totalBought,totalSold,totalProfit,holdCost,available};
}

// ── 投资项计算 ──
function getTotalInvested(item){return item.invested+(item.records||[]).reduce((s,r)=>s+r.amount,0)}
function getRemain(item){return Math.max(0,item.target-getTotalInvested(item))}
function getPct(item){return Math.min(100,Math.round(getTotalInvested(item)/item.target*100))}
function isCompleted(item){return getTotalInvested(item)>=item.target}

function renderMain(){
  // 投资进度总计
  const nonStock=ITEMS.filter(i=>i.group!=='stock');
  const totalTarget=nonStock.reduce((s,i)=>s+i.target,0);
  const totalInvested=nonStock.reduce((s,i)=>s+getTotalInvested(i),0);
  const totalRemain=totalTarget-totalInvested;
  const overallPct=totalTarget>0?Math.round(totalInvested/totalTarget*100):0;

  // 股票账户汇总
  const acc=calcAccount();
  const totalStockProfit=acc.totalProfit;

  // 英雄卡
  const heroHtml=`
    <div class="hero">
      <div class="hero-lbl">定投目标总额（不含股票）</div>
      <div class="hero-amt">¥${fmt2(totalTarget)}</div>
      <div class="hero-grid">
        <div class="hg"><div class="hg-l">已投入</div><div class="hg-v neu">¥${fmt2(totalInvested)}</div></div>
        <div class="hg"><div class="hg-l">还差</div><div class="hg-v warn">¥${fmt2(totalRemain)}</div></div>
        <div class="hg"><div class="hg-l">股票已获利</div><div class="hg-v pos">+¥${fmt2(totalStockProfit)}</div></div>
      </div>
      <div class="overall-bar"><div class="overall-fill" style="width:${overallPct}%"></div></div>
      <div class="overall-lbl"><span>整体完成度 ${overallPct}%</span><span>¥${fmt2(totalInvested)} / ¥${fmt2(totalTarget)}</span></div>
    </div>`;

  // 股票账户卡
  const accHtml=`
    <div class="account-card" onclick="openAccountEdit()">
      <div class="ac-title">📊 股票账户</div>
      <div class="ac-main">
        <div>
          <div class="ac-avail-lbl">可用资金</div>
          <div class="ac-avail" style="color:${acc.available>=0?'#e8eaf0':'#ef5350'}">${fmtY(acc.available)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:10px;color:#445;margin-bottom:3px">累计止盈利润</div>
          <div style="font-size:18px;font-weight:700;color:#4caf50">+${fmtY(acc.totalProfit)}</div>
        </div>
      </div>
      <div class="ac-stats">
        <div class="ac-stat"><div class="ac-sl">初始资金</div><div class="ac-sv neu">${fmtY(acc.initial)}</div></div>
        <div class="ac-stat"><div class="ac-sl">追加资金</div><div class="ac-sv neu">${fmtY(acc.deposited)}</div></div>
        <div class="ac-stat"><div class="ac-sl">当前持仓</div><div class="ac-sv warn">${fmtY(acc.holdCost)}</div></div>
      </div>
    </div>`;

  // 股票列表
  let stocksHtml=STOCK_ACCOUNT.stocks.map(st=>{
    const c=calcStock(st);
    const pnlTxt=c.totalProfit>0?`已获利 +${fmtY(c.totalProfit)}`:'暂无止盈记录';
    const holdPct=c.holdQty>0&&c.totalBought>0?Math.round(c.holdQty/c.totalBought*100):0;
    return`<div class="stock-card" onclick="openStockDetail('${st.id}')">
      <div class="sc-top">
        <div class="ic-left">
          <div class="sc-name">📊 ${st.name}</div>
          <div class="sc-meta">均价 ${fmtY(c.avgCost)} · 持仓${c.holdQty}股 · 成本${fmtY(c.holdCost)}</div>
        </div>
        <div class="sc-right">
          <div class="sc-cost" style="color:#4caf50">+${fmtY(c.totalProfit)}</div>
          <div class="sc-pnl ${c.totalProfit>0?'pos':'neu'}">${pnlTxt}</div>
        </div>
      </div>
      <div class="sl-grid">
        <div class="sl-item tp">
          <div class="sl-label">止盈价（+${st.tpPct||20}%）</div>
          <div class="sl-price tp">${fmtY(c.tpPrice)}</div>
          <div class="sl-pct tp">均价 ${fmtY(c.avgCost)}</div>
        </div>
        <div class="sl-item sl">
          <div class="sl-label">止损价（${st.slPct||-15}%）</div>
          <div class="sl-price sl">${fmtY(c.slPrice)}</div>
          <div class="sl-pct sl">若触发损失 ${fmtY(c.holdCost*Math.abs((st.slPct||-15)/100))}</div>
        </div>
      </div>
      <div class="tp-plan-list">${st.tpPlans.map((tp,i)=>`
        <div class="tp-plan-item">
          <span class="tp-tag ${tp.done?'done':''}">${tp.done?'已完成':'计划'}</span>
          <span class="ic-sl" style="flex:1;font-size:11px;color:#778">${tp.note||'止盈'} · ${tp.qty}股 @ ${fmtY(tp.price)}</span>
          <span class="tp-profit ${tp.done?'done':''}">${tp.done?'已完成':'+'+fmtY((tp.price-c.avgCost)*tp.qty)}</span>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');

  // 投资定投分组
  let groupsHtml='';
  ['fund','gold','saving'].forEach(g=>{
    const items=ITEMS.filter(i=>i.group===g);if(!items.length)return;
    const gi=GROUP_INFO[g];
    const gInv=items.reduce((s,i)=>s+getTotalInvested(i),0);
    const gTgt=items.reduce((s,i)=>s+i.target,0);
    const itemsHtml=items.map(item=>{
      const totalInv=getTotalInvested(item);
      const remain=getRemain(item);
      const pct=getPct(item);
      const done=isCompleted(item);
      const barColor=done?'#4caf50':pct>80?'#ff9800':'#378ADD';
      return`<div class="inv-card ${done?'completed':''}" onclick="openItemDetail('${item.id}')">
        <div class="ic-top">
          <div class="ic-left">
            <div class="ic-name">${gi.icon} ${item.name}<span class="ic-badge ${done?'done':gi.badgeClass}">${done?'✓ 已达标':gi.label}</span></div>
            <div class="ic-meta">${item.platform}${item.note?' · '+item.note:''}</div>
          </div>
          <div class="ic-right">

  else if(modal==='stock-edit')renderStockEditModal();
  else if(modal==='buy-add')renderBuyAddModal();
  else if(modal==='sell-add')renderSellAddModal();

  else if(modal==='item-detail')renderItemDetailModal();

function mkOv(){

function renderBuyAddModal(){

  const ov=mkOv();
  ov.innerHTML=`<div class="modal-sheet">

    <div class="minfo">当前均价 ${fmtY(c.avgCost)} · 持仓${c.holdQty}股<br>买入后自动重新计算加权均价</div>
    <div class="mfields">
      <div class="mfield"><span class="mflbl">买入日期</span><input id="b-date" type="date" value="${todayStr()}"></div>
      <div class="mfield"><span class="mflbl">买入价格</span><input id="b-price" type="number" inputmode="decimal" step="0.001" placeholder="0.000" oninput="calcBuyTotal()"></div>
      <div class="mfield"><span class="mflbl">买入股数</span><input id="b-qty" type="number" inputmode="numeric" step="100" placeholder="0" oninput="calcBuyTotal()"></div>
      <div class="mfield"><span class="mflbl">买入金额</span><input id="b-amt" type="number" inputmode="decimal" step="0.01" placeholder="自动计算" oninput="calcBuyAvg()"></div>
      <div class="mfield"><span class="mflbl">备注</span><input id="b-note" placeholder="如：补仓跌10%"></div>
    </div>
    <div class="calc-box" id="buy-calc" style="display:none">
      <div class="calc-row"><span class="calc-lbl">买入后总股数</span><span class="calc-val" id="bc-qty">—</span></div>
      <div class="calc-row"><span class="calc-lbl">新加权均价</span><span class="calc-val" id="bc-avg">—</span></div>
    </div>
    <button class="msub green" onclick="submitBuy('${st.id}')">确认买入</button>
  </div>`;
  document.body.appendChild(ov);
}
function calcBuyTotal(){
  const price=parseFloat(document.getElementById('b-price')?.value)||0;
  const qty=parseFloat(document.getElementById('b-qty')?.value)||0;
  if(price>0&&qty>0){
    const amt=document.getElementById('b-amt');
    if(amt&&!amt.dataset.manual)amt.value=(price*qty).toFixed(2);
  }
  calcBuyAvg();
}
function calcBuyAvg(){
  const st=STOCK_ACCOUNT.stocks.find(s=>s.id===editId);if(!st)return;
  const c=calcStock(st);
  const qty=parseFloat(document.getElementById('b-qty')?.value)||0;
  const amt=parseFloat(document.getElementById('b-amt')?.value)||0;
  const price=parseFloat(document.getElementById('b-price')?.value)||0;
  const actualAmt=amt||(price*qty);
  if(qty>0&&actualAmt>0){
    const newQty=c.totalBought+qty;
    const newAvg=(c.totalCost+actualAmt)/newQty;
    document.getElementById('buy-calc').style.display='';
    document.getElementById('bc-qty').textContent=(c.holdQty+qty)+'股';
    document.getElementById('bc-avg').textContent=fmtY(newAvg);
  }
}
function submitBuy(stId){
  const st=STOCK_ACCOUNT.stocks.find(s=>s.id===stId);if(!st)return;
  const date=document.getElementById('b-date')?.value||todayStr();
  const price=parseFloat(document.getElementById('b-price')?.value);
  const qty=parseFloat(document.getElementById('b-qty')?.value);
  const amt=parseFloat(document.getElementById('b-amt')?.value)||(price*qty);
  const note=document.getElementById('b-note')?.value.trim()||'';
  if(!price||!qty||!amt){alert('请填写价格和股数');return;}
  st.buyRecords.push({id:genId(),date,price,qty,amount:amt,note});
  saveData();modal='stock-detail';renderMain();
}

function renderSellAddModal(){
  const st=STOCK_ACCOUNT.stocks.find(s=>s.id===editId);if(!st)return;
  const c=calcStock(st);
  const pendingPlans=st.tpPlans.filter(tp=>!tp.done);
  const planOpts=pendingPlans.map(tp=>`<option value="${tp.id}">${tp.note} · ${tp.qty}股 @ ${fmtY(tp.price)}</option>`).join('');
  const ov=mkOv();
  ov.innerHTML=`<div class="modal-sheet">
    <div class="mhandle"></div>
    <div class="mtitle">止盈卖出 · ${st.name}</div>
    <div class="minfo">均价 ${fmtY(c.avgCost)} · 持仓${c.holdQty}股<br>卖出利润自动计入账户可用资金</div>
    ${pendingPlans.length?`<div class="mfield" style="margin-bottom:10px"><span class="mflbl">对应计划</span><select id="s-plan"><option value="">不对应计划</option>${planOpts}</select></div>`:''}
    <div class="mfields">
      <div class="mfield"><span class="mflbl">卖出日期</span><input id="s-date" type="date" value="${todayStr()}"></div>
      <div class="mfield"><span class="mflbl">卖出价格</span><input id="s-price" type="number" inputmode="decimal" step="0.001" placeholder="0.000" oninput="calcSellProfit()"></div>
      <div class="mfield"><span class="mflbl">卖出股数</span><input id="s-qty" type="number" inputmode="numeric" step="100" placeholder="0" oninput="calcSellProfit()"></div>
      <div class="mfield"><span class="mflbl">备注</span><input id="s-note" placeholder="如：止盈①"></div>
    </div>
    <div class="calc-box" id="sell-calc" style="display:none">
      <div class="calc-row"><span class="calc-lbl">卖出金额</span><span class="calc-val" id="sc-amt">—</span></div>
      <div class="calc-row"><span class="calc-lbl">本次利润</span><span class="calc-val" id="sc-profit">—</span></div>
      <div class="calc-row"><span class="calc-lbl">卖出后剩余</span><span class="calc-val" id="sc-remain">—</span></div>
    </div>
    <button class="msub green" onclick="submitSell('${st.id}')">确认卖出</button>
  </div>`;
  document.body.appendChild(ov);
}
function calcSellProfit(){
  const st=STOCK_ACCOUNT.stocks.find(s=>s.id===editId);if(!st)return;
  const c=calcStock(st);
  const price=parseFloat(document.getElementById('s-price')?.value)||0;
  const qty=parseFloat(document.getElementById('s-qty')?.value)||0;
  if(price>0&&qty>0){
    const sellAmt=price*qty;
    const costAmt=c.avgCost*qty;
    const profit=sellAmt-costAmt;
    document.getElementById('sell-calc').style.display='';
    document.getElementById('sc-amt').textContent=fmtY(sellAmt);
    document.getElementById('sc-profit').textContent=(profit>=0?'+':'')+fmtY(profit);
    document.getElementById('sc-profit').className='calc-val'+(profit>=0?'':' neg');
    document.getElementById('sc-remain').textContent=(c.holdQty-qty)+'股';
  }
}
function submitSell(stId){
  const st=STOCK_ACCOUNT.stocks.find(s=>s.id===stId);if(!st)return;
  const c=calcStock(st);
  const date=document.getElementById('s-date')?.value||todayStr();
  const price=parseFloat(document.getElementById('s-price')?.value);
  const qty=parseFloat(document.getElementById('s-qty')?.value);
  const note=document.getElementById('s-note')?.value.trim()||'';
  const planId=document.getElementById('s-plan')?.value||'';
  if(!price||!qty){alert('请填写价格和股数');return;}
  if(qty>c.holdQty){alert(`持仓只有${c.holdQty}股，无法卖出${qty}股`);return;}
  const sellAmt=price*qty;
  const profit=sellAmt-c.avgCost*qty;
  st.sellRecords.push({id:genId(),date,price,qty,amount:sellAmt,profit,note});
  // 标记对应止盈计划为已完成
  if(planId){const tp=st.tpPlans.find(t=>t.id===planId);if(tp)tp.done=true;}
  saveData();modal='stock-detail';renderMain();
}

let tmpTpPlans=null;

function submitStockEdit(stId){
  const st=STOCK_ACCOUNT.stocks.find(s=>s.id===stId);if(!st)return;

  st.note=document.getElementById('e-note')?.value.trim()||'';

  const plans=tmpTpPlans||st.tpPlans;

// ── 账户资金编辑 ──
function renderAccountEditModal(){
  const acc=calcAccount();const ov=mkOv();
  const depRows=STOCK_ACCOUNT.deposits.map((d,i)=>`
    <div class="buy-item">
      <span class="buy-date">${d.date}</span>
      <span class="buy-qty" style="color:#4caf50">+${fmtY(d.amount)}</span>
      <span style="flex:1;color:#445;font-size:11px">${d.note||''}</span>
      <button onclick="deleteDeposit(${i})" style="background:none;border:none;color:#445;cursor:pointer;font-size:14px">×</button>
    </div>`).join('');
  ov.innerHTML=`<div class="modal-sheet">
    <div class="mhandle"></div>
    <div class="mtitle">股票账户资金</div>
    <div class="minfo">初始资金 ${fmtY(acc.initial)} · 追加 ${fmtY(acc.deposited)}<br>当前可用 <b style="color:#e8eaf0">${fmtY(acc.available)}</b> · 持仓成本 <b style="color:#ff9800">${fmtY(acc.holdCost)}</b></div>
    <div class="msec">修改初始资金</div>
    <div class="mfields">
      <div class="mfield"><span class="mflbl">初始资金</span><input id="a-init" type="number" inputmode="decimal" value="${acc.initial}"></div>
    </div>
    <div class="msec">追加资金</div>
    <div class="mfields">
      <div class="mfield"><span class="mflbl">追加金额</span><input id="a-dep" type="number" inputmode="decimal" step="100" placeholder="0"></div>
      <div class="mfield"><span class="mflbl">日期</span><input id="a-date" type="date" value="${todayStr()}"></div>
      <div class="mfield"><span class="mflbl">备注</span><input id="a-note" placeholder="如：追加操作资金"></div>
    </div>
    <button class="msub green" onclick="submitDeposit()">确认追加</button>
    ${STOCK_ACCOUNT.deposits.length?`<div class="msec">追加记录</div><div class="buy-list">${depRows}</div>`:''}
    <button class="msub" style="margin-top:8px" onclick="saveInitial()">保存初始资金</button>
  </div>`;
  document.body.appendChild(ov);
}
function submitDeposit(){
  const amt=parseFloat(document.getElementById('a-dep')?.value);
  const date=document.getElementById('a-date')?.value||todayStr();
  const note=document.getElementById('a-note')?.value.trim()||'';
  if(!amt||amt<=0){alert('请填写追加金额');return;}
  STOCK_ACCOUNT.deposits.push({date,amount:amt,note});
  saveData();modal='account-edit';renderMain();
}
function deleteDeposit(i){
  if(!confirm('确认删除这条追加记录？'))return;
  STOCK_ACCOUNT.deposits.splice(i,1);
  saveData();modal='account-edit';renderMain();
}
function saveInitial(){
  const v=parseFloat(document.getElementById('a-init')?.value);
  if(v>0)STOCK_ACCOUNT.initialCapital=v;
  saveData();modal=null;renderMain();
}

// ── 投资定投详情 ──
function openItemDetail(id){modal='item-detail';editId=id;renderMain()}
function openAddInv(){modal='item-add';editId=null;renderMain()}

function renderItemDetailModal(){
  const item=ITEMS.find(i=>i.id===editId);if(!item)return;
  const gi=GROUP_INFO[item.group]||GROUP_INFO.fund;
  const totalInv=getTotalInvested(item);
  const remain=getRemain(item);
  const pct=getPct(item);
  const done=isCompleted(item);
  const recs=(item.records||[]).slice().reverse();
  const recsHtml=recs.length?recs.map((r,ri)=>`
    <div class="buy-item">
      <span class="buy-date">${r.date}</span>
      <span class="buy-qty" style="color:#4caf50">+${fmtY(r.amount)}</span>
      <span style="flex:1;color:#445">${r.note||''}</span>
      <button onclick="deleteInvRecord('${item.id}',${(item.records||[]).length-1-ri})" style="background:none;border:none;color:#445;cursor:pointer;font-size:14px">×</button>
    </div>`).join(''):`<div class="empty-hint">还没有定投记录</div>`;
  const ov=mkOv();
  ov.innerHTML=`<div class="modal-sheet">
    <div class="mhandle"></div>
    <div class="mtitle">${item.name}</div>
    <div class="msub-title">${item.platform}${item.note?' · '+item.note:''}</div>
    <div class="minfo">已投入 <b style="color:#e8eaf0">${fmtY(totalInv)}</b> / 目标 <b style="color:#e8eaf0">${fmtY(item.target)}</b><br>${done?'<span style="color:#4caf50">✓ 已达标！</span>':`还差 <b style="color:#ff9800">${fmtY(remain)}</b>，完成 ${pct}%`}</div>
    <div class="msec">记录本次定投</div>
    <div class="mfields">
      <div class="mfield"><span class="mflbl">金额</span><input id="r-amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="本次实际金额"></div>
      <div class="mfield"><span class="mflbl">日期</span><input id="r-date" type="date" value="${todayStr()}"></div>
      <div class="mfield"><span class="mflbl">备注</span><input id="r-note" placeholder="可选"></div>
    </div>
    <button class="msub green" onclick="submitInvRecord('${item.id}')">✓ 记录定投</button>
    <div class="msec">历史记录（${(item.records||[]).length}笔）</div>
    <div class="buy-list">${recsHtml}</div>
    <button class="msub gray" onclick="modal='item-edit';renderMain()">编辑基本信息</button>
    <button class="mdel" onclick="deleteInvItem('${item.id}')">删除此项目</button>
  </div>`;
  document.body.appendChild(ov);
}
function submitInvRecord(itemId){
  const amt=parseFloat(document.getElementById('r-amt')?.value);
  const date=document.getElementById('r-date')?.value||todayStr();
  const note=document.getElementById('r-note')?.value.trim()||'';
  if(!amt||amt<=0){alert('请填写金额');return;}
  const idx=ITEMS.findIndex(i=>i.id===itemId);if(idx<0)return;
  if(!ITEMS[idx].records)ITEMS[idx].records=[];
  ITEMS[idx].records.push({date,amount:amt,note});
  saveData();modal='item-detail';renderMain();
}
function deleteInvRecord(itemId,recIdx){
  if(!confirm('确认删除？'))return;
  const idx=ITEMS.findIndex(i=>i.id===itemId);if(idx<0)return;
  ITEMS[idx].records.splice(recIdx,1);
  saveData();modal='item-detail';renderMain();
}
function deleteInvItem(id){
  if(!confirm('确认删除这个项目？'))return;
  ITEMS=ITEMS.filter(i=>i.id!==id);
  saveData();modal=null;editId=null;renderMain();
}

function renderItemEditModal(){
  const item=ITEMS.find(i=>i.id===editId);if(!item)return;
  const ov=mkOv();
  const groupOpts=Object.entries(GROUP_INFO).filter(([k])=>k!=='stock').map(([k,v])=>`<option value="${k}" ${item.group===k?'selected':''}>${v.icon} ${v.label}</option>`).join('');
  ov.innerHTML=`<div class="modal-sheet">
    <div class="mhandle"></div>
    <div class="mtitle">编辑 · ${item.name}</div>
    <div class="mfields">
      <div class="mfield"><span class="mflbl">名称</span><input id="e-name" value="${item.name}"></div>
      <div class="mfield"><span class="mflbl">分组</span><select id="e-group">${groupOpts}</select></div>
      <div class="mfield"><span class="mflbl">目标金额</span><input id="e-target" type="number" value="${item.target}"></div>
      <div class="mfield"><span class="mflbl">初始已投</span><input id="e-invested" type="number" value="${item.invested}"></div>
      <div class="mfield"><span class="mflbl">基准月投</span><input id="e-monthly" type="number" value="${item.monthly}"></div>
      <div class="mfield"><span class="mflbl">平台</span><input id="e-platform" value="${item.platform}"></div>
      <div class="mfield"><span class="mflbl">备注</span><input id="e-note" value="${item.note||''}"></div>
    </div>
    <button class="msub" onclick="submitItemEdit('${item.id}')">保存</button>
  </div>`;
  document.body.appendChild(ov);
}
function submitItemEdit(id){
  const idx=ITEMS.findIndex(i=>i.id===id);if(idx<0)return;
  ITEMS[idx]={...ITEMS[idx],
    name:document.getElementById('e-name')?.value.trim()||ITEMS[idx].name,
    group:document.getElementById('e-group')?.value||ITEMS[idx].group,
    target:parseFloat(document.getElementById('e-target')?.value)||ITEMS[idx].target,
    invested:parseFloat(document.getElementById('e-invested')?.value)||0,
    monthly:parseFloat(document.getElementById('e-monthly')?.value)||0,
    platform:document.getElementById('e-platform')?.value.trim()||'',
    note:document.getElementById('e-note')?.value.trim()||'',
  };
  saveData();modal=null;editId=null;renderMain();
}

function renderItemAddModal(){
  const ov=mkOv();
  const groupOpts=Object.entries(GROUP_INFO).filter(([k])=>k!=='stock').map(([k,v])=>`<option value="${k}">${v.icon} ${v.label}</option>`).join('');
  ov.innerHTML=`<div class="modal-sheet">
    <div class="mhandle"></div>
    <div class="mtitle">新增投资项目</div>
    <div class="mfields">
      <div class="mfield"><span class="mflbl">名称</span><input id="n-name" placeholder="如：纳斯达克100"></div>
      <div class="mfield"><span class="mflbl">分组</span><select id="n-group">${groupOpts}</select></div>
      <div class="mfield"><span class="mflbl">目标金额</span><input id="n-target" type="number" placeholder="0"></div>
      <div class="mfield"><span class="mflbl">已投入</span><input id="n-invested" type="number" placeholder="0"></div>
      <div class="mfield"><span class="mflbl">基准月投</span><input id="n-monthly" type="number" placeholder="0"></div>
      <div class="mfield"><span class="mflbl">平台</span><input id="n-platform" placeholder="支付宝、理财通..."></div>
      <div class="mfield"><span class="mflbl">备注</span><input id="n-note" placeholder="基金名称、定投日..."></div>
    </div>
    <button class="msub" onclick="submitAddInv()">添加</button>
  </div>`;
  document.body.appendChild(ov);
}
function submitAddInv(){
  const name=document.getElementById('n-name')?.value.trim();
  const target=parseFloat(document.getElementById('n-target')?.value);
  if(!name||!target){alert('请填写名称和目标金额');return;}
  ITEMS.push({id:genId(),group:document.getElementById('n-group')?.value||'fund',name,
    target,invested:parseFloat(document.getElementById('n-invested')?.value)||0,
    monthly:parseFloat(document.getElementById('n-monthly')?.value)||0,
    platform:document.getElementById('n-platform')?.value.trim()||'',
    note:document.getElementById('n-note')?.value.trim()||'',records:[]});
  saveData();modal=null;renderMain();
}

// ── 数据备份 ──
function renderDataModal(){
  const ov=mkOv();
  ov.innerHTML=`<div class="modal-sheet">
    <div class="mhandle"></div>
    <div class="mtitle">数据备份</div>
    <div class="minfo">导出后保存到微信文件助手或云盘，换设备或清缓存时恢复</div>
    <div class="data-btns">
      <button class="data-btn export" onclick="exportData()">📤 导出数据</button>
      <button class="data-btn import" onclick="document.getElementById('imp-file').click()">📥 导入数据</button>
      <input type="file" id="imp-file" accept=".json" style="display:none" onchange="importData(event)">
      <button class="data-btn danger" onclick="resetData()">🗑 恢复默认数据</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
}
function exportData(){
  const data=ld();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const d=new Date();
  a.download=`财务总览备份_${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.json`;
  a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.items&&!data.stockAccount){alert('文件格式不对');return;}
      localStorage.setItem(SK,ev.target.result);
      loadData();modal=null;renderMain();alert('✓ 导入成功');
    }catch(err){alert('导入失败');}
  };
  reader.readAsText(file);
}
function resetData(){
  if(!confirm('确认恢复默认数据？'))return;
  ITEMS=JSON.parse(JSON.stringify(DEFAULT_ITEMS));
  STOCK_ACCOUNT=JSON.parse(JSON.stringify(DEFAULT_STOCK_ACCOUNT));
  saveData();modal=null;renderMain();
}

loadData();renderMain();
</script>
