<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>财务总览 - 财务管家</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:#0f1117;color:#e8eaf0}
.shell{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;background:#0f1117;position:sticky;top:0;z-index:10;border-bottom:1px solid #1a2030}
.topbar-left{display:flex;align-items:center;gap:10px}
.back-home{font-size:20px;color:#556;text-decoration:none}
.topbar-title{font-size:16px;font-weight:700;color:#e8eaf0}
.topbar-right{display:flex;gap:8px}
.tbtn{font-size:11px;color:#378ADD;background:none;border:1px solid #1e3a5f;border-radius:8px;padding:4px 10px;cursor:pointer}
.tbtn.green{color:#4caf50;border-color:#1e3a1e}
.scroll-body{flex:1;padding:12px 12px 32px}
.hero{background:linear-gradient(135deg,#1a2744,#0f1a2e);border:1px solid #1e3a5f;border-radius:18px;padding:18px;margin-bottom:10px}
.hero-lbl{font-size:11px;color:#445;letter-spacing:.06em;margin-bottom:5px}
.hero-amt{font-size:32px;font-weight:700;letter-spacing:-.5px;margin-bottom:12px}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.hg{background:rgba(255,255,255,.04);border-radius:10px;padding:8px;text-align:center}
.hg-l{font-size:10px;color:#445;margin-bottom:3px}
.hg-v{font-size:13px;font-weight:600}
.hg-v.pos{color:#4caf50}.hg-v.neu{color:#e8eaf0}.hg-v.warn{color:#ff9800}
.overall-bar{height:6px;background:#1e2a3a;border-radius:3px;overflow:hidden}
.overall-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#378ADD,#4caf50);transition:width .6s}
.overall-lbl{display:flex;justify-content:space-between;font-size:10px;color:#445;margin-top:5px}
.group-hdr{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px;margin-top:8px}
.group-title{font-size:12px;font-weight:700;color:#556;letter-spacing:.05em}
.group-total{font-size:11px;color:#445}
.inv-card{background:#161b26;border:1px solid #1e2a3a;border-radius:14px;padding:14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.inv-card:active{border-color:#378ADD}
.inv-card.completed{border-color:#2e5e2e;background:#131a13}
.ic-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.ic-left{flex:1;min-width:0}
.ic-name{font-size:14px;font-weight:600;color:#e8eaf0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ic-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
.ic-badge.done{background:#1e3a1e;color:#4caf50}
.ic-badge.active{background:#1e3a5f;color:#378ADD}
.ic-badge.saving{background:#2a2010;color:#ff9800}
.ic-badge.stock{background:#2a1a2a;color:#9c27b0}
.ic-meta{font-size:11px;color:#445;margin-top:3px}
.ic-right{text-align:right;flex-shrink:0;margin-left:10px}
.ic-remain{font-size:15px;font-weight:700;color:#e8eaf0}
.ic-remain.done{color:#4caf50}
.ic-sub{font-size:10px;color:#445;margin-top:2px}
.ic-bar-bg{height:5px;background:#1e2a3a;border-radius:3px;overflow:hidden;margin-bottom:8px}
.ic-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.ic-stats{display:flex;gap:0}
.ic-stat{flex:1;text-align:center;border-right:1px solid #1e2a3a}
.ic-stat:last-child{border-right:none}
.ic-sl{font-size:10px;color:#445;margin-bottom:2px}
.ic-sv{font-size:12px;font-weight:600;color:#e8eaf0}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;justify-content:flex-end;z-index:100}
.modal-sheet{background:#1a1f2e;border-radius:20px 20px 0 0;padding:18px 16px 32px;max-height:90%;overflow-y:auto}
.mhandle{width:32px;height:4px;border-radius:2px;background:#2a3040;margin:0 auto 14px}
.mtitle{font-size:15px;font-weight:700;color:#e8eaf0;margin-bottom:4px}
.msub-title{font-size:12px;color:#445;margin-bottom:14px}
.msec{font-size:11px;font-weight:600;color:#445;letter-spacing:.04em;margin:14px 0 8px}
.mfields{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.mfield{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0f1117;border-radius:10px;border:1px solid #1e2a3a}
.mflbl{font-size:11px;color:#445;width:56px;flex-shrink:0}
.mfield input,.mfield select{flex:1;background:none;border:none;outline:none;font-size:13px;color:#e8eaf0;font-family:inherit}
.mfield select option{background:#1a1f2e}
.msub{width:100%;height:44px;border-radius:12px;border:none;background:#378ADD;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px}
.msub.green{background:#2e7d32}
.msub.gray{background:#1e2a3a;color:#778}
.mdel{width:100%;height:38px;border-radius:10px;border:1px solid #3a1a1a;background:transparent;color:#ef5350;font-size:13px;cursor:pointer}
.minfo{font-size:11px;color:#e8eaf0;text-align:center;margin-bottom:12px;line-height:1.8;padding:10px 12px;background:#0f1117;border-radius:10px}
.rec-list{margin-bottom:12px;max-height:200px;overflow-y:auto}
.rec-item{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid #1e2a3a;font-size:12px;color:#778}
.rec-item:last-child{border-bottom:none}
.rec-del{background:none;border:none;color:#445;cursor:pointer;font-size:15px;padding:0 4px}
.no-rec{text-align:center;color:#334;font-size:12px;padding:16px 0}
.data-btns{display:flex;flex-direction:column;gap:8px}
.data-btn{width:100%;height:44px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;border:none}
.data-btn.export{background:#1e3a5f;color:#378ADD}
.data-btn.import{background:#1e2a1e;color:#4caf50}
.data-btn.danger{background:#3a1a1a;color:#ef5350}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="topbar-left">
      <a class="back-home" href="../">←</a>
      <span class="topbar-title">财务总览</span>
    </div>
    <div class="topbar-right">
      <button class="tbtn green" onclick="openData()">备份</button>
      <button class="tbtn" onclick="openAddItem()">+ 添加</button>
    </div>
  </div>
  <div class="scroll-body"><div id="main-content"></div></div>
</div>
<script>
const SK='finance_v1';
const DEFAULT_ITEMS=[
  {id:'f1',group:'fund',name:'沪深300',target:11650,invested:5595,monthly:865,platform:'支付宝',note:'华泰柏瑞沪深300，每月16日',records:[]},
  {id:'f2',group:'fund',name:'中证500',target:11650,invested:5681.5,monthly:865,platform:'支付宝',note:'南方中证500，每月16日',records:[]},
  {id:'f3',group:'fund',name:'中证红利',target:27200,invested:10960,monthly:2320,platform:'支付宝',note:'易方达中证红利，每月16日',records:[]},
  {id:'f4',group:'fund',name:'永赢科技',target:7000,invested:2410,monthly:600,platform:'理财通',note:'每月16日',records:[]},
  {id:'f5',group:'fund',name:'景顺长城',target:7000,invested:2920,monthly:600,platform:'理财通',note:'每月16日',records:[]},
  {id:'f6',group:'fund',name:'工银瑞信',target:7000,invested:3160,monthly:600,platform:'理财通',note:'每月16日',records:[]},
  {id:'g1',group:'gold',name:'黄金积存金',target:25500,invested:11123.7,monthly:2050,platform:'工商银行',note:'积存金，每月16日',records:[]},
  {id:'s1',group:'saving',name:'现金安全垫',target:25000,invested:20500,monthly:500,platform:'支付宝',note:'支持4-5个月生活',records:[]},
  {id:'s2',group:'saving',name:'Pocket3 + 内存卡',target:3500,invested:3500,monthly:500,platform:'微信定期',note:'618活动已达标，可购入',records:[]},
  {id:'s3',group:'saving',name:'阿勒泰滑雪',target:16000,invested:1500,monthly:0,platform:'微信定期',note:'Pocket3完成后每月500转入',records:[]},
  {id:'k1',group:'stock',name:'光伏板块',target:5000,invested:3000,monthly:0,platform:'中泰证券',note:'',records:[]},
  {id:'k2',group:'stock',name:'通信板块',target:5000,invested:3000,monthly:0,platform:'中泰证券',note:'',records:[]},
];
const GROUP_INFO={
  fund:{label:'基金定投',icon:'📈',badgeClass:'active'},
  gold:{label:'黄金积存金',icon:'🥇',badgeClass:'active'},
  saving:{label:'储蓄目标',icon:'🎯',badgeClass:'saving'},
  stock:{label:'股票持仓',icon:'📊',badgeClass:'stock'},
};
function ld(){try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){return{}}}
function sv(d){localStorage.setItem(SK,JSON.stringify(d))}
function fmt(n,dec=0){return'¥'+Number(Math.abs(n)).toFixed(dec)}
function fmtN(n,dec=2){return Number(Math.abs(n)).toFixed(dec)}
function pad2(n){return String(n).padStart(2,'0')}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function genId(){return'i'+Date.now().toString(36)}
let ITEMS=[],modal=null,editId=null;
function loadData(){const s=ld();ITEMS=s.items||JSON.parse(JSON.stringify(DEFAULT_ITEMS));}
function saveData(){const s=ld();s.items=ITEMS;sv(s);}
function getTotalInvested(item){return item.invested+(item.records||[]).reduce((s,r)=>s+r.amount,0)}
function getRemain(item){return Math.max(0,item.target-getTotalInvested(item))}
function getPct(item){return Math.min(100,Math.round(getTotalInvested(item)/item.target*100))}
function isCompleted(item){return getTotalInvested(item)>=item.target}

function renderMain(){
  const nonStock=ITEMS.filter(i=>i.group!=='stock');
  const totalTarget=nonStock.reduce((s,i)=>s+i.target,0);
  const totalInvested=nonStock.reduce((s,i)=>s+getTotalInvested(i),0);
  const totalRemain=totalTarget-totalInvested;
  const overallPct=totalTarget>0?Math.round(totalInvested/totalTarget*100):0;
  const stockTotal=ITEMS.filter(i=>i.group==='stock').reduce((s,i)=>s+getTotalInvested(i),0);
  let groupsHtml='';
  ['fund','gold','saving','stock'].forEach(g=>{
    const items=ITEMS.filter(i=>i.group===g);
    if(!items.length)return;
    const gi=GROUP_INFO[g];
    const gInv=items.reduce((s,i)=>s+getTotalInvested(i),0);
    const gTgt=items.reduce((s,i)=>s+i.target,0);
    const itemsHtml=items.map(item=>{
      const totalInv=getTotalInvested(item);
      const remain=getRemain(item);
      const pct=getPct(item);
      const done=isCompleted(item);
      const barColor=done?'#4caf50':pct>80?'#ff9800':'#378ADD';
      const badgeClass=done?'done':gi.badgeClass;
      const badgeLabel=done?'✓ 已达标':gi.label;
      let statsHtml='';
      if(g==='stock'){
        statsHtml=`<div class="ic-stat"><div class="ic-sl">持仓成本</div><div class="ic-sv">${fmt(totalInv)}</div></div><div class="ic-stat"><div class="ic-sl">目标金额</div><div class="ic-sv">${fmt(item.target)}</div></div><div class="ic-stat"><div class="ic-sl">平台</div><div class="ic-sv" style="font-size:10px">${item.platform}</div></div>`;
      }else{
        statsHtml=`<div class="ic-stat"><div class="ic-sl">已投入</div><div class="ic-sv">${fmt(totalInv)}</div></div><div class="ic-stat"><div class="ic-sl">目标</div><div class="ic-sv">${fmt(item.target)}</div></div>${item.monthly>0?`<div class="ic-stat"><div class="ic-sl">基准月投</div><div class="ic-sv">${fmt(item.monthly)}</div></div>`:`<div class="ic-stat"><div class="ic-sl">平台</div><div class="ic-sv" style="font-size:10px">${item.platform}</div></div>`}`;
      }
      return`<div class="inv-card ${done?'completed':''}" onclick="openItemDetail('${item.id}')">
        <div class="ic-top">
          <div class="ic-left">
            <div class="ic-name">${gi.icon} ${item.name}<span class="ic-badge ${badgeClass}">${badgeLabel}</span></div>
            <div class="ic-meta">${item.platform}${item.note?' · '+item.note:''}</div>
          </div>
          <div class="ic-right">
            <div class="ic-remain ${done?'done':''}">${done?'已达标':fmt(remain)}</div>
            <div class="ic-sub">${pct}% 完成</div>
          </div>
        </div>
        <div class="ic-bar-bg"><div class="ic-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
        <div class="ic-stats">${statsHtml}</div>
      </div>`;
    }).join('');
    groupsHtml+=`<div class="group-hdr"><span class="group-title">${gi.icon} ${gi.label}</span><span class="group-total">${fmt(gInv)} / ${fmt(gTgt)}</span></div>${itemsHtml}`;
  });
  document.getElementById('main-content').innerHTML=`
    <div class="hero">
      <div class="hero-lbl">目标总投入（不含股票）</div>
      <div class="hero-amt">¥${fmtN(totalTarget,0)}</div>
      <div class="hero-grid">
        <div class="hg"><div class="hg-l">已投入</div><div class="hg-v neu">¥${fmtN(totalInvested,0)}</div></div>
        <div class="hg"><div class="hg-l">还差</div><div class="hg-v warn">¥${fmtN(totalRemain,0)}</div></div>
        <div class="hg"><div class="hg-l">股票持仓</div><div class="hg-v neu">¥${fmtN(stockTotal,0)}</div></div>
      </div>
      <div class="overall-bar"><div class="overall-fill" style="width:${overallPct}%"></div></div>
      <div class="overall-lbl"><span>整体完成度 ${overallPct}%</span><span>¥${fmtN(totalInvested,0)} / ¥${fmtN(totalTarget,0)}</span></div>
    </div>
    ${groupsHtml}`;
  checkModal();
}

function openItemDetail(id){modal='detail';editId=id;renderMain()}
function openAddItem(){modal='add';editId=null;renderMain()}
function openData(){modal='data';renderMain()}
function checkModal(){
  document.querySelectorAll('.modal-overlay').forEach(e=>e.remove());
  if(modal==='detail')renderDetailModal();
  else if(modal==='add')renderAddModal();
  else if(modal==='edit')renderEditModal();
  else if(modal==='data')renderDataModal();
}
function mkOv(){
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.addEventListener('click',e=>{if(e.target===ov){modal=null;editId=null;renderMain()}});
  return ov;
}

function renderDetailModal(){
  const item=ITEMS.find(i=>i.id===editId);if(!item)return;
  const totalInv=getTotalInvested(item);
  const remain=getRemain(item);
  const pct=getPct(item);
  const done=isCompleted(item);
  const recs=(item.records||[]).slice().reverse();
  const recsHtml=recs.length?recs.map((r,ri)=>`
    <div class="rec-item">
      <span>${r.date}</span>
      <span style="color:#4caf50;font-weight:600">+¥${Number(r.amount).toFixed(2)}</span>
      <span style="color:#445;flex:1;text-align:center">${r.note||''}</span>
      <button class="rec-del" onclick="deleteRecord('${item.id}',${(item.records||[]).length-1-ri})">×</button>
    </div>`).join(''):`<div class="no-rec">还没有定投记录</div>`;
  const ov=mkOv();
  ov.innerHTML=`<div class="modal-sheet">
    <div class="mhandle"></div>
    <div class="mtitle">${item.name}</div>
    <div class="msub-title">${item.platform}${item.note?' · '+item.note:''}</div>
    <div class="minfo">
      已投入 <b>¥${fmtN(totalInv,2)}</b> ／ 目标 <b>¥${fmtN(item.target,0)}</b><br>
      ${done?'<span style="color:#4caf50;font-weight:600">✓ 已达标！</span>':`还差 <b style="color:#ff9800">¥${fmtN(remain,2)}</b>，完成 ${pct}%`}
    </div>
    ${item.group!=='stock'?`
    <div class="msec">记录本次定投</div>
    <div class="mfields">
      <div class="mfield"><span class="mflbl">实际金额</span><input id="r-amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="本次实际买入金额（元）"></div>
      <div class="mfield"><span class="mflbl">日期</span><input id="r-date" type="date" value="${todayStr()}"></div>
      <div class="mfield"><span class="mflbl">备注</span><input id="r-note" placeholder="可选，如：动态加倍"></div>
    </div>
    <button class="msub green" onclick="submitRecord('${item.id}')">✓ 记录定投</button>`:''}
    <div class="msec">历史记录（${(item.records||[]).length}笔）</div>
    <div class="rec-list">${recsHtml}</div>
    <button class="msub gray" onclick="openEditModal('${item.id}')">编辑基本信息</button>
    <button class="mdel" onclick="deleteItem('${item.id}')">删除此项目</button>
  </div>`;
  document.body.appendChild(ov);
}

function submitRecord(itemId){
  const amt=parseFloat(document.getElementById('r-amt')?.value);
  const date=document.getElementById('r-date')?.value||todayStr();
  const note=document.getElementById('r-note')?.value.trim()||'';
  if(isNaN(amt)||amt<=0){alert('请填写本次买入金额');return;}
  const idx=ITEMS.findIndex(i=>i.id===itemId);if(idx<0)return;
  if(!ITEMS[idx].records)ITEMS[idx].records=[];
  ITEMS[idx].records.push({date,amount:amt,note});
  saveData();modal='detail';renderMain();
}
function deleteRecord(itemId,recIdx){
  if(!confirm('确认删除这条记录？'))return;
  const idx=ITEMS.findIndex(i=>i.id===itemId);if(idx<0)return;
  ITEMS[idx].records.splice(recIdx,1);
  saveData();modal='detail';renderMain();
}
function openEditModal(id){modal='edit';editId=id;renderMain()}

function renderEditModal(){
  const item=ITEMS.find(i=>i.id===editId);if(!item)return;
  const ov=mkOv();
  const groupOpts=Object.entries(GROUP_INFO).map(([k,v])=>`<option value="${k}" ${item.group===k?'selected':''}>${v.icon} ${v.label}</option>`).join('');
  ov.innerHTML=`<div class="modal-sheet">
    <div class="mhandle"></div>
    <div class="mtitle">编辑 · ${item.name}</div>
    <div class="mfields">
      <div class="mfield"><span class="mflbl">名称</span><input id="e-name" value="${item.name}"></div>
      <div class="mfield"><span class="mflbl">分组</span><select id="e-group">${groupOpts}</select></div>
      <div class="mfield"><span class="mflbl">目标金额</span><input id="e-target" type="number" min="0" step="1" value="${item.target}"></div>
      <div class="mfield"><span class="mflbl">初始已投</span><input id="e-invested" type="number" min="0" step="0.01" value="${item.invested}"></div>
      <div class="mfield"><span class="mflbl">基准月投</span><input id="e-monthly" type="number" min="0" step="1" value="${item.monthly}"></div>
      <div class="mfield"><span class="mflbl">平台</span><input id="e-platform" value="${item.platform}"></div>
      <div class="mfield"><span class="mflbl">备注</span><input id="e-note" value="${item.note||''}"></div>
    </div>
    <button class="msub" onclick="submitEdit('${item.id}')">保存修改</button>
  </div>`;
  document.body.appendChild(ov);
}
function submitEdit(id){
  const idx=ITEMS.findIndex(i=>i.id===id);if(idx<0)return;
  const name=document.getElementById('e-name')?.value.trim();
  const group=document.getElementById('e-group')?.value;
  const target=parseFloat(document.getElementById('e-target')?.value);
  const invested=parseFloat(document.getElementById('e-invested')?.value);
  const monthly=parseFloat(document.getElementById('e-monthly')?.value)||0;
  const platform=document.getElementById('e-platform')?.value.trim()||'';
  const note=document.getElementById('e-note')?.value.trim()||'';
  if(!name||isNaN(target)||isNaN(invested)){alert('请填写完整信息');return;}
  ITEMS[idx]={...ITEMS[idx],name,group,target,invested,monthly,platform,note};
  saveData();modal=null;editId=null;renderMain();
}
function deleteItem(id){
  if(!confirm('确认删除这个项目及其所有记录？'))return;
  ITEMS=ITEMS.filter(i=>i.id!==id);
  saveData();modal=null;editId=null;renderMain();
}

function renderAddModal(){
  const ov=mkOv();
  const groupOpts=Object.entries(GROUP_INFO).map(([k,v])=>`<option value="${k}">${v.icon} ${v.label}</option>`).join('');
  ov.innerHTML=`<div class="modal-sheet">
    <div class="mhandle"></div>
    <div class="mtitle">新增投资项目</div>
    <div class="mfields">
      <div class="mfield"><span class="mflbl">名称</span><input id="n-name" placeholder="如：纳斯达克100"></div>
      <div class="mfield"><span class="mflbl">分组</span><select id="n-group">${groupOpts}</select></div>
      <div class="mfield"><span class="mflbl">目标金额</span><input id="n-target" type="number" min="0" step="1" placeholder="0"></div>
      <div class="mfield"><span class="mflbl">已投入</span><input id="n-invested" type="number" min="0" step="0.01" placeholder="当前已投入金额"></div>
      <div class="mfield"><span class="mflbl">基准月投</span><input id="n-monthly" type="number" min="0" step="1" placeholder="每月基准定投额"></div>
      <div class="mfield"><span class="mflbl">平台</span><input id="n-platform" placeholder="如：支付宝、理财通"></div>
      <div class="mfield"><span class="mflbl">备注</span><input id="n-note" placeholder="基金名称、定投日等"></div>
    </div>
    <button class="msub" onclick="submitAdd()">添加</button>
  </div>`;
  document.body.appendChild(ov);
}
function submitAdd(){
  const name=document.getElementById('n-name')?.value.trim();
  const group=document.getElementById('n-group')?.value;
  const target=parseFloat(document.getElementById('n-target')?.value);
  const invested=parseFloat(document.getElementById('n-invested')?.value)||0;
  const monthly=parseFloat(document.getElementById('n-monthly')?.value)||0;
  const platform=document.getElementById('n-platform')?.value.trim()||'';
  const note=document.getElementById('n-note')?.value.trim()||'';
  if(!name||isNaN(target)||target<=0){alert('请填写名称和目标金额');return;}
  ITEMS.push({id:genId(),group,name,target,invested,monthly,platform,note,records:[]});
  saveData();modal=null;renderMain();
}

function renderDataModal(){
  const ov=mkOv();
  ov.innerHTML=`<div class="modal-sheet">
    <div class="mhandle"></div>
    <div class="mtitle">数据备份</div>
    <div class="minfo">导出后保存到微信文件助手或云盘<br>换设备或清除浏览器缓存时可以恢复</div>
    <div class="data-btns">
      <button class="data-btn export" onclick="exportData()">📤 导出数据（JSON）</button>
      <button class="data-btn import" onclick="document.getElementById('imp-file').click()">📥 导入数据</button>
      <input type="file" id="imp-file" accept=".json" style="display:none" onchange="importData(event)">
      <button class="data-btn danger" onclick="resetData()">🗑 恢复默认初始数据</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
}
function exportData(){
  const data=ld();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  const d=new Date();
  a.download=`财务总览备份_${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.json`;
  a.click();URL.revokeObjectURL(url);
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.items){alert('文件格式不对，请选择正确的备份文件');return;}
      sv(data);loadData();modal=null;renderMain();alert('✓ 导入成功！');
    }catch(err){alert('导入失败，请检查文件');}
  };
  reader.readAsText(file);
}
function resetData(){
  if(!confirm('确认恢复默认数据？当前数据将被清除！'))return;
  ITEMS=JSON.parse(JSON.stringify(DEFAULT_ITEMS));
  saveData();modal=null;renderMain();
}

loadData();
renderMain();
</script>
</body>
</html>
